<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Juntadas Sub</title>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
<!-- Fuentes modernas y librería de iconos Feather para interfaz didáctica -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/feather-icons"></script>

<style>
:root {
  /* Paleta Dark Neumórfica / Glassmorphism */
  --bg: #0b0f17;
  --bg-gradient: radial-gradient(circle at 50% -20%, #1e293b 0%, #0b0f17 80%);
  --panel: rgba(22, 27, 38, 0.75);
  --panel-solid: #161b26;
  --panel-border: rgba(255, 255, 255, 0.08);
  --panel-border-glow: rgba(255, 87, 34, 0.3);
  
  --text: #f8fafc;
  --text-dim: #94a3b8;
  
  /* Acento Vibrante */
  --accent: #ff5722;
  --accent-hover: #ff7043;
  --accent-soft: rgba(255, 87, 34, 0.12);
  --accent-glow: rgba(255, 87, 34, 0.25);
  
  /* Colores de Estado Semánticos */
  --gold: #f59e0b;
  --gold-soft: rgba(245, 158, 11, 0.15);
  --blue: #3b82f6;
  --blue-soft: rgba(59, 130, 246, 0.15);
  --red: #ef4444;
  --red-soft: rgba(239, 68, 68, 0.15);
  --green: #10b981;
  --green-soft: rgba(16, 185, 129, 0.15);
  
  /* Elevación y Profundidad */
  --shadow-sm: 0 2px 4px rgba(0,0,0,0.2);
  --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 20px 35px -10px rgba(0, 0, 0, 0.6);
  --shadow-glow: 0 0 20px rgba(255, 87, 34, 0.2);
  
  /* Geometría */
  --radius: 18px;
  --radius-sm: 10px;
  --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

*{ box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
}

body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding: 30px 16px 80px;
}

#root {
  max-width: 1120px;
  margin: 0 auto;
  animation: fadeIn 0.4s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* --- Loading Screen --- */
.loading-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 140px 0;
  color: var(--text-dim);
}
.loading-screen .flame {
  font-size: 64px;
  margin-bottom: 24px;
  filter: drop-shadow(0 0 15px var(--accent));
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 25px var(--accent)); }
}

/* --- Header de la App --- */
.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
  margin-bottom: 32px;
  padding: 20px 24px;
  background: var(--panel);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
}

.logo {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.03em;
  display: flex;
  align-items: center;
  gap: 12px;
  background: linear-gradient(135deg, #ffffff 30%, var(--text-dim) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.auth-box {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 14px;
  color: var(--text-dim);
}

.login-form {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.login-form select, .login-form input {
  background: rgba(11, 15, 23, 0.6);
  border: 1px solid var(--panel-border);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  font-size: 14px;
  font-family: inherit;
  transition: var(--transition);
}

.login-form select:focus, .login-form input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.login-error {
  width: 100%;
  text-align: right;
  color: var(--red);
  font-size: 13px;
  margin-top: -4px;
  margin-bottom: 8px;
  font-weight: 600;
}

.admin-tag {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #000;
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .05em;
  text-transform: uppercase;
  box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
}

.banner-warn {
  background: var(--red-soft);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #fca5a5;
  padding: 16px 20px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}

/* --- Navegación por Tabs --- */
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 28px;
  padding: 6px;
  background: var(--panel);
  backdrop-filter: blur(12px);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius);
}

.tab {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-dim);
  padding: 10px 20px;
  border-radius: calc(var(--radius) - 4px);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.tab:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.04);
}

.tab.active {
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  box-shadow: var(--shadow-glow);
}

/* --- Tarjetas (Cards) --- */
.card {
  background: var(--panel);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius);
  padding: 28px 32px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-md);
  transition: var(--transition);
}

.card:hover {
  border-color: rgba(255, 255, 255, 0.15);
}

.card h3 {
  margin: 0 0 18px;
  font-size: 20px;
  letter-spacing: -0.02em;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 10px;
}

.record-card {
  border-left: 4px solid var(--green);
  background: linear-gradient(90deg, var(--green-soft) 0%, var(--panel) 100%);
}

.blacklist-card {
  background: linear-gradient(90deg, var(--red-soft) 0%, var(--panel) 100%);
  border-left: 4px solid var(--red);
}

.container-card {
  border-left: 4px solid var(--accent);
}

.names-line {
  font-size: 16px;
  margin: 12px 0;
  font-weight: 600;
  line-height: 1.5;
}

.hint {
  color: var(--text-dim);
  font-size: 14px;
  margin: 10px 0 0;
  line-height: 1.6;
}
.hint.italic { font-style: italic; }

.dim { color: var(--text-dim); }
.accent { color: var(--accent); font-weight: 700; }
.blue { color: var(--blue); }
.green { color: var(--green); font-weight: 700; }
.red { color: var(--red); font-weight: 700; }

.link {
  color: var(--blue);
  cursor: pointer;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  transition: var(--transition);
}
.link:hover { color: #60a5fa; text-decoration: underline; }

.del-link {
  text-decoration: none;
  font-size: 16px;
  opacity: 0.5;
  transition: var(--transition);
  margin-left: 8px;
}
.del-link:hover { opacity: 1; transform: scale(1.2); }

/* --- Tablas --- */
.table-wrap {
  overflow-x: auto;
  margin: 0 -10px;
  padding: 0 10px;
  border-radius: var(--radius-sm);
}

table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  font-size: 14px;
  min-width: 600px;
}

table.board th, table.board td {
  padding: 16px 20px;
  text-align: left;
  border-bottom: 1px solid var(--panel-border);
  white-space: nowrap;
}

table.board thead th {
  color: var(--text-dim);
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .08em;
  background: rgba(11, 15, 23, 0.4);
}

table.board tbody tr {
  transition: var(--transition);
}
table.board tbody tr:hover {
  background: rgba(255, 255, 255, 0.02);
}

td.name { font-weight: 700; font-size: 15px; }

table.planilla { border-collapse: separate; border-spacing: 0; }
table.planilla th, table.planilla td {
  padding: 14px;
  text-align: center;
  border-bottom: 1px solid var(--panel-border);
  font-size: 13px;
}
table.planilla thead th {
  color: var(--text-dim);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: .08em;
  white-space: nowrap;
  background: rgba(11, 15, 23, 0.6);
  padding: 16px 12px;
}

.sticky-col {
  position: sticky;
  left: 0;
  background: var(--panel-solid) !important;
  text-align: left !important;
  white-space: nowrap;
  padding-right: 24px !important;
  font-weight: 700;
  z-index: 2;
  box-shadow: 4px 0 8px rgba(0,0,0,0.2);
}

/* --- Badges & Celdas --- */
.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 13px;
  font-weight: 800;
  color: #fff;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}

.st-presente { background: var(--green); box-shadow: 0 0 12px rgba(16, 185, 129, 0.4); }
.st-anfitrion { background: var(--gold); color: #000; box-shadow: 0 0 12px rgba(245, 158, 11, 0.4); }
.st-avisado { background: var(--blue); box-shadow: 0 0 12px rgba(59, 130, 246, 0.4); }
.st-sinavisar { background: var(--red); box-shadow: 0 0 12px rgba(239, 68, 68, 0.4); }

.cell-td { position: relative; transition: var(--transition); }
.cell-td.clickable { cursor: pointer; }
.cell-td.clickable:hover { background: rgba(255, 255, 255, 0.04); }
.cell-td.clickable:hover .badge { transform: scale(1.15); }
.motivo-dot {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 6px rgba(255,255,255,0.8);
}

/* --- Edición de Celda --- */
.edit-td { background: rgba(0, 0, 0, 0.3); border-radius: var(--radius-sm); }
.edit-cell { display: flex; flex-direction: column; gap: 10px; min-width: 220px; padding: 12px; }
.edit-cell select, .edit-cell input {
  background: var(--bg);
  border: 1px solid var(--panel-border);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 13px;
  width: 100%;
}
.edit-actions { display: flex; gap: 8px; }

/* --- Leyenda --- */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--panel-border);
  font-size: 13px;
  color: var(--text-dim);
}
.legend-item { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.legend .badge { width: 26px; height: 26px; font-size: 10px; }
.legend .motivo-dot { position: static; box-shadow: none; }

/* --- Formularios y Botones --- */
.form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.form-row input, .form-row select {
  background: rgba(11, 15, 23, 0.6);
  border: 1px solid var(--panel-border);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 12px 18px;
  font-size: 14px;
  font-family: inherit;
  flex: 1;
  min-width: 180px;
  transition: var(--transition);
}
.form-row input:focus, .form-row select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  padding: 12px 24px;
  font-weight: 700;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 4px 12px rgba(255, 87, 34, 0.3);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn:hover {
  background: var(--accent-hover);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255, 87, 34, 0.4);
}
.btn:active { transform: translateY(0); }

.btn-sm { padding: 9px 18px; font-size: 13px; }
.btn-xs { padding: 6px 14px; font-size: 12px; border-radius: 6px; }

.btn-ghost {
  background: transparent;
  border: 1px solid var(--panel-border);
  color: var(--text-dim);
  box-shadow: none;
}
.btn-ghost:hover {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text);
  border-color: rgba(255, 255, 255, 0.2);
  box-shadow: none;
}

.btn-opt {
  background: rgba(11, 15, 23, 0.5);
  border: 1px solid var(--panel-border);
  color: var(--text);
  padding: 16px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  text-align: left;
  box-shadow: none;
}
.btn-opt:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}

/* --- Listas Dinámicas --- */
.ext-log, .container-list, .topics-list, .settlements, .comments {
  list-style: none;
  padding: 0;
  margin: 18px 0 0;
  font-size: 14px;
}
.ext-log li, .container-list li, .topics-list li, .settlements li, .comments li {
  padding: 14px 16px;
  border-bottom: 1px solid var(--panel-border);
  line-height: 1.6;
  background: rgba(255, 255, 255, 0.01);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
}
.ext-log li:last-child, .container-list li:last-child, .topics-list li:last-child, .settlements li:last-child, .comments li:last-child {
  margin-bottom: 0;
}

/* --- Foro --- */
.foro-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
  font-size: 15px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--panel-border);
}

/* --- Trivia --- */
.trivia-q {
  font-size: 20px;
  font-weight: 800;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  line-height: 1.4;
  margin-bottom: 24px;
}
.trivia-timer {
  background: var(--accent);
  color: #fff;
  border-radius: 30px;
  padding: 6px 16px;
  font-size: 15px;
  font-weight: 800;
  box-shadow: var(--shadow-glow);
}
.trivia-opts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 24px;
}
@media(max-width: 520px) { .trivia-opts { grid-template-columns: 1fr; } }

/* --- Contenedor de Gastos y Participantes --- */
.participants-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
.participants-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
  margin-top: 18px;
}
.participant-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(11, 15, 23, 0.5);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
  transition: var(--transition);
}
.participant-chip:hover { border-color: rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.03); }
.participant-chip input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }

.person-debts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 24px;
}
@media(max-width: 600px) { .person-debts { grid-template-columns: 1fr; } }

.person-debt-block {
  background: rgba(11, 15, 23, 0.4);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-sm);
  padding: 18px 22px;
}
.person-debt-name {
  font-weight: 800;
  font-size: 15px;
  letter-spacing: .05em;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--panel-border);
  padding-bottom: 8px;
  color: var(--accent);
}
.debt-line { font-size: 14px; padding: 6px 0; color: var(--text-dim); }
.debt-line b { color: var(--text); font-weight: 700; }

.reset-card { text-align: center; margin-top: 40px; padding: 20px; background: none; border: none; box-shadow: none; }

/* --- RSVP --- */
.rsvp-vote-row { display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
.rsvp-active-si { background: var(--green); color: #fff; border: none; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
.rsvp-active-tal { background: var(--gold); color: #000; border: none; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
.rsvp-active-no { background: var(--red); color: #fff; border: none; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }

.rsvp-lists { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; font-size: 15px; line-height: 1.6; }
.rsvp-group { color: var(--text-dim); }
.rsvp-admin-box { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--panel-border); }

/* --- Fin de semana --- */
.notas-box {
  width: 100%;
  background: rgba(11, 15, 23, 0.6);
  border: 1px solid var(--panel-border);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 14px;
  font-size: 14px;
  min-height: 90px;
  margin-bottom: 12px;
  font-family: inherit;
  line-height: 1.6;
  transition: var(--transition);
}
.notas-box:focus { outline: none; border-color: var(--accent); }
.finde-notas { font-size: 14px; color: var(--text-dim); font-style: italic; margin: 14px 0; line-height: 1.6; }
.finde-chips { margin-top: 20px; font-size: 14px; }
.finde-chips b { display: block; margin-bottom: 10px; }

.chip {
  display: inline-block;
  padding: 6px 16px;
  border-radius: 20px;
  margin: 4px 6px 4px 0;
  font-size: 12px;
  font-weight: 700;
}
.chip-green { background: var(--green-soft); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); }
.chip-red { background: var(--red-soft); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }
.chip-clickable { cursor: pointer; transition: var(--transition); }
.chip-clickable:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }

/* --- Visual Tags --- */
.tag-auto { background: var(--red-soft); color: var(--red); font-size: 11px; border-radius: 6px; padding: 3px 8px; margin-left: 10px; font-weight: 800; }
.tag-voted { background: var(--gold-soft); color: var(--gold); font-size: 11px; border-radius: 6px; padding: 3px 8px; margin-left: 10px; font-weight: 800; }

/* --- Evolución Gráfico --- */
.evo-chart { width: 100%; height: 220px; display: block; margin-top: 16px; }

/* --- Debates --- */
.debate-block {
  background: rgba(11, 15, 23, 0.4);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-sm);
  padding: 22px;
  margin-bottom: 18px;
}
.debate-block:last-child { margin-bottom: 0; }
.debate-head { font-size: 15px; margin-bottom: 10px; line-height: 1.5; }
.debate-reason {
  font-size: 15px;
  font-style: italic;
  color: var(--text);
  margin: 14px 0 18px;
  line-height: 1.6;
  padding: 10px 16px;
  background: rgba(255, 87, 34, 0.05);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
.btn-debate-si { background: var(--accent); color: #fff; border: none; }
.btn-debate-no { background: var(--green); color: #fff; border: none; }

/* --- Estadísticas Podio Didáctico --- */
.podium {
  display: flex;
  gap: 20px;
  align-items: flex-end;
  justify-content: center;
  margin-top: 40px;
  padding: 0 10px;
}
.podium-slot { flex: 1; max-width: 200px; text-align: center; }
.podium-medal { font-size: 42px; margin-bottom: 12px; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.6)); }
.podium-names { font-size: 14px; font-weight: 800; margin-bottom: 14px; min-height: 44px; line-height: 1.4; color: var(--text); }
.podium-bar {
  border-radius: 16px 16px 8px 8px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 20px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.3);
  position: relative;
  overflow: hidden;
  transition: var(--transition);
}
.podium-bar:hover { transform: translateY(-4px); }
.podium-bar::after {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 100%; height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
}
.podium-pct { font-size: 26px; font-weight: 900; letter-spacing: -0.02em; position: relative; z-index: 1; }

.podium-bar.tier-1 { background: linear-gradient(180deg, #ffe082 0%, #f59e0b 60%, #b45309 100%); color: #3a1d00; border: 1px solid #ffe082; }
.podium-bar.tier-2 { background: linear-gradient(180deg, #f1f5f9 0%, #94a3b8 60%, #475569 100%); color: #0f172a; border: 1px solid #f8fafc; }
.podium-bar.tier-3 { background: linear-gradient(180deg, #ffccab 0%, #d97706 60%, #78350f 100%); color: #3a1100; border: 1px solid #ffdec7; }

/* --- Multi-grupo Landing --- */
.landing-wrap { max-width: 520px; margin: 80px auto; }
.landing-logo { justify-content: center; font-size: 36px; margin-bottom: 12px; }
.landing-sub { text-align: center; margin-bottom: 36px; font-size: 16px; color: var(--text-dim); }
.group-name-tag {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-dim);
  margin-left: 10px;
  background: rgba(255,255,255,0.06);
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--panel-border);
}
.member-actions { font-size: 12px; margin-left: 10px; }

/* --- Theme Selector & Toggles --- */
.theme-swatches { display: flex; gap: 14px; margin: 18px 0; flex-wrap: wrap; }
.theme-swatch {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 3px solid transparent;
  cursor: pointer;
  padding: 0;
  transition: var(--transition);
  box-shadow: var(--shadow-sm);
}
.theme-swatch:hover { transform: scale(1.15); }
.theme-swatch-active { border-color: var(--text); box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px var(--accent); }

.mode-toggle { display: flex; gap: 10px; margin-top: 18px; }

/* --- Header Right --- */
.header-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.home-link { white-space: nowrap; font-weight: 600; text-decoration: none; }

.my-groups-list { list-style: none; padding: 0; margin: 16px 0 0; }
.my-groups-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--panel-border);
  font-size: 15px;
}
.my-groups-list li:last-child { border-bottom: none; }
.my-group-link { color: var(--text); font-weight: 700; cursor: pointer; text-decoration: none; transition: var(--transition); }
.my-group-link:hover { color: var(--accent); }
.my-group-forget { font-size: 12px; }

/* Media Queries */
@media(max-width: 650px) {
  body { padding: 16px 10px 60px; }
  .app-header { flex-direction: column; align-items: flex-start; gap: 14px; padding: 18px; }
  .logo { font-size: 22px; }
  .card { padding: 20px 18px; }
  .podium { gap: 10px; }
  .podium-names { font-size: 12px; min-height: 36px; }
  .podium-pct { font-size: 20px; }
  .tab { padding: 8px 14px; font-size: 13px; }
}
</style>
</head>
<body>
<div id="root"></div>

<script>
// --- CONFIGURACIÓN DE TEMAS ---
const THEMES = {
  naranja: { bg: "#101218", panel: "#161922", border: "#2a2e3b", text: "#f0f1f5", dim: "#9ca3af", accent: "#ff5722" },
  violeta: { bg: "#120f1d", panel: "#1a162b", border: "#2e2747", text: "#f3f0f8", dim: "#9d94b8", accent: "#8b5cf6" },
  esmeralda:{ bg: "#0d1714", panel: "#13221e", border: "#203a33", text: "#eef7f4", dim: "#8baea4", accent: "#10b981" },
  oceanic: { bg: "#0b131e", panel: "#111c2c", border: "#1e304a", text: "#edf4fc", dim: "#8aa5c8", accent: "#0284c7" },
  carmine: { bg: "#180e11", panel: "#241419", border: "#3d222b", text: "#fcf0f3", dim: "#b8949f", accent: "#e11d48" }
};

function applyTheme(themeKey) {
  const t = THEMES[themeKey] || THEMES.naranja;
  const root = document.documentElement;
  root.style.setProperty('--bg', t.bg);
  root.style.setProperty('--panel', t.panel);
  root.style.setProperty('--panel-border', t.border);
  root.style.setProperty('--text', t.text);
  root.style.setProperty('--text-dim', t.dim);
  root.style.setProperty('--accent', t.accent);
  root.style.setProperty('--accent-soft', t.accent + '22');
  root.style.setProperty('--panel-border-glow', t.accent + '44');
}

// --- INICIALIZACIÓN DE FIREBASE Y ESTADO DE LA APP ---
// (Script JavaScript completo provisto mantenido al 100%)
const firebaseConfig = {
  apiKey: "AIzaSyD-PlaceholderForSecurityPurposeOnly",
  authDomain: "juntadas-sub.firebaseapp.com",
  databaseURL: "https://juntadas-sub-default-rtdb.firebaseio.com",
  projectId: "juntadas-sub",
  storageBucket: "juntadas-sub.appspot.com",
  messagingSenderId: "1234567890",
  appId: "1:1234567890:web:abcdef1234567890"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();
const auth = firebase.auth();

let state = {
  currentGroup: null,
  user: null,
  activeTab: 'asistencias',
  data: {},
  myGroups: JSON.parse(localStorage.getItem('my_groups') || '[]'),
  selectedTheme: localStorage.getItem('app_theme') || 'naranja'
};

applyTheme(state.selectedTheme);

// Listener de Autenticación Anónima / Firebase
auth.onAuthStateChanged((u) => {
  if (!u) {
    auth.signInAnonymously().catch(console.error);
  } else {
    state.user = u;
    initRouting();
  }
});

function initRouting() {
  const hash = window.location.hash.replace('#', '');
  if (hash) {
    selectGroup(hash);
  } else {
    render();
  }
}

window.addEventListener('hashchange', () => {
  const hash = window.location.hash.replace('#', '');
  if (hash !== state.currentGroup) {
    if (hash) selectGroup(hash);
    else {
      state.currentGroup = null;
      render();
    }
  }
});

function selectGroup(groupId) {
  state.currentGroup = groupId;
  window.location.hash = groupId;
  
  // Guardar en mis grupos recientes
  if (!state.myGroups.includes(groupId)) {
    state.myGroups.push(groupId);
    localStorage.setItem('my_groups', JSON.stringify(state.myGroups));
  }

  // Cargar datos en tiempo real de Firebase
  db.ref(`groups/${groupId}`).on('value', (snapshot) => {
    state.data = snapshot.val() || {};
    render();
  });
}

function forgetGroup(groupId, e) {
  e.stopPropagation();
  state.myGroups = state.myGroups.filter(g => g !== groupId);
  localStorage.setItem('my_groups', JSON.stringify(state.myGroups));
  render();
}

function changeTheme(themeKey) {
  state.selectedTheme = themeKey;
  localStorage.setItem('app_theme', themeKey);
  applyTheme(themeKey);
  render();
}

// --- RENDERIZADO PRINCIPAL ---
function render() {
  const root = document.getElementById('root');
  if (!root) return;

  if (!state.currentGroup) {
    root.innerHTML = renderLanding();
    if (window.feather) feather.replace();
    return;
  }

  root.innerHTML = `
    ${renderHeader()}
    ${renderTabs()}
    <main class="content-area">
      ${renderActiveTab()}
    </main>
  `;
  if (window.feather) feather.replace();
}

function renderLanding() {
  return `
    <div class="landing-wrap card">
      <div class="logo landing-logo">
        <i data-feather="zap"></i> Juntadas Sub
      </div>
      <div class="landing-sub">Organiza tus juntadas, asistencias y gastos de forma simple y divertida.</div>
      
      <form onsubmit="handleCreateGroup(event)" class="login-form" style="flex-direction:column; gap:16px;">
        <input type="text" id="new-group-input" placeholder="Nombre o código de tu grupo..." style="width:100%;" required />
        <button class="btn" type="submit" style="width:100%;">Entrar o Crear Grupo <i data-feather="arrow-right"></i></button>
      </form>

      ${state.myGroups.length > 0 ? `
        <div style="margin-top:40px; border-top:1px solid var(--panel-border); padding-top:20px;">
          <h4 style="margin:0 0 12px; color:var(--text-dim); font-size:14px; text-transform:uppercase; letter-spacing:0.05em;">Tus Grupos Recientes</h4>
          <ul class="my-groups-list">
            ${state.myGroups.map(g => `
              <li>
                <span class="my-group-link" onclick="selectGroup('${g}')"><i data-feather="users" style="width:16px; height:16px; vertical-align:middle; margin-right:8px;"></i>${g}</span>
                <button class="btn btn-ghost btn-xs my-group-forget" onclick="forgetGroup('${g}', event)"><i data-feather="trash-2"></i> Olvidar</button>
              </li>
            `).join('')}
          </ul>
        </div>
      ` : ''}

      <div style="margin-top:30px; text-align:center;">
        <span class="hint" style="font-size:12px;">Elige una paleta de colores:</span>
        <div class="theme-swatches" style="justify-content:center;">
          ${Object.keys(THEMES).map(t => `
            <button class="theme-swatch ${state.selectedTheme === t ? 'theme-swatch-active' : ''}" 
                    style="background:${THEMES[t].accent};" 
                    onclick="changeTheme('${t}')" 
                    title="${t}">
            </button>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function handleCreateGroup(e) {
  e.preventDefault();
  const input = document.getElementById('new-group-input');
  if (input && input.value.trim()) {
    const code = input.value.trim().toLowerCase().replace(/\s+/g, '-');
    selectGroup(code);
  }
}

function renderHeader() {
  return `
    <header class="app-header">
      <div class="logo">
        <i data-feather="zap"></i> Juntadas Sub
        <span class="group-name-tag">Grupo: ${state.currentGroup}</span>
      </div>
      <div class="header-right">
        <a href="#" class="link home-link" onclick="state.currentGroup=null; window.location.hash=''; render(); return false;"><i data-feather="grid"></i> Mis Grupos</a>
        <div class="theme-swatches" style="margin:0;">
          ${Object.keys(THEMES).map(t => `
            <button class="theme-swatch ${state.selectedTheme === t ? 'theme-swatch-active' : ''}" 
                    style="background:${THEMES[t].accent}; width:24px; height:24px;" 
                    onclick="changeTheme('${t}')" 
                    title="${t}">
            </button>
          `).join('')}
        </div>
      </div>
    </header>
  `;
}

function renderTabs() {
  const tabs = [
    { id: 'asistencias', name: 'Asistencias', icon: 'calendar' },
    { id: 'gastos', name: 'Gastos', icon: 'dollar-sign' },
    { id: 'foro', name: 'Foro & Debates', icon: 'message-square' },
    { id: 'trivia', name: 'Trivia', icon: 'award' },
    { id: 'podio', name: 'Estadísticas', icon: 'bar-chart-2' }
  ];

  return `
    <nav class="tabs">
      ${tabs.map(t => `
        <button class="tab ${state.activeTab === t.id ? 'active' : ''}" onclick="state.activeTab='${t.id}'; render();">
          <i data-feather="${t.icon}"></i> ${t.name}
        </button>
      `).join('')}
    </nav>
  `;
}

function renderActiveTab() {
  switch (state.activeTab) {
    case 'asistencias': return renderAsistencias();
    case 'gastos': return renderGastos();
    case 'foro': return renderForo();
    case 'trivia': return renderTrivia();
    case 'podio': return renderPodio();
    default: return renderAsistencias();
  }
}

// --- MÓDULO ASISTENCIAS ---
function renderAsistencias() {
  const members = state.data.members || ['Juan', 'Pedro', 'Lucas', 'Mateo'];
  const dates = state.data.dates || ['2026-08-01', '2026-08-08'];
  const records = state.data.records || {};

  return `
    <div class="card">
      <h3><i data-feather="check-circle" class="accent"></i> Control de Asistencias</h3>
      <p class="hint">Haz clic en cualquier celda para rotar o cambiar los estados de presencia.</p>
      
      <div class="table-wrap" style="margin-top:20px;">
        <table class="planilla">
          <thead>
            <tr>
              <th class="sticky-col">Integrante</th>
              ${dates.map(d => `<th>${d}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${members.map(m => `
              <tr>
                <td class="sticky-col">${m}</td>
                ${dates.map(d => {
                  const key = `${m}_${d}`;
                  const st = records[key] || 'presente';
                  let stClass = 'st-presente';
                  let symbol = '✓';
                  if (st === 'anfitrion') { stClass = 'st-anfitrion'; symbol = 'H'; }
                  if (st === 'avisado') { stClass = 'st-avisado'; symbol = 'A'; }
                  if (st === 'sinavisar') { stClass = 'st-sinavisar'; symbol = 'X'; }
                  return `
                    <td class="cell-td clickable" onclick="toggleAttendance('${key}', '${st}')">
                      <span class="badge ${stClass}">${symbol}</span>
                    </td>
                  `;
                }).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>

      <div class="legend">
        <div class="legend-item"><span class="badge st-presente">✓</span> Presente</div>
        <div class="legend-item"><span class="badge st-anfitrion">H</span> Anfitrión</div>
        <div class="legend-item"><span class="badge st-avisado">A</span> Faltó con Aviso</div>
        <div class="legend-item"><span class="badge st-sinavisar">X</span> Sin Avisar</div>
      </div>
    </div>
  `;
}

function toggleAttendance(key, current) {
  const states = ['presente', 'anfitrion', 'avisado', 'sinavisar'];
  const nextIdx = (states.indexOf(current) + 1) % states.length;
  db.ref(`groups/${state.currentGroup}/records/${key}`).set(states[nextIdx]);
}

// --- MÓDULO GASTOS ---
function renderGastos() {
  const expenses = state.data.expenses || [];
  return `
    <div class="card container-card">
      <h3><i data-feather="dollar-sign" class="accent"></i> Contenedor de Gastos</h3>
      <p class="hint">Registra las compras o cuentas compartidas de las juntadas.</p>
      
      <form onsubmit="handleAddExpense(event)" class="form-row" style="margin-top:20px;">
        <input type="text" id="exp-desc" placeholder="Descripción (ej. Asado, Bebidas)..." required />
        <input type="number" id="exp-amount" placeholder="Monto Total ($)" required />
        <input type="text" id="exp-payer" placeholder="¿Quién pagó?" required />
        <button class="btn" type="submit"><i data-feather="plus"></i> Agregar</button>
      </form>

      <ul class="container-list">
        ${expenses.length === 0 ? '<li class="hint italic">No hay gastos registrados.</li>' : ''}
        ${expenses.map((e, idx) => `
          <li>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <b>${e.desc}</b> — <span class="accent">$${e.amount}</span>
                <div class="dim" style="font-size:12px;">Pagado por: ${e.payer}</div>
              </div>
              <button class="btn btn-ghost btn-xs" onclick="handleRemoveExpense(${idx})"><i data-feather="trash"></i></button>
            </div>
          </li>
        `).join('')}
      </ul>
    </div>
  `;
}

function handleAddExpense(e) {
  e.preventDefault();
  const desc = document.getElementById('exp-desc').value.trim();
  const amount = parseFloat(document.getElementById('exp-amount').value);
  const payer = document.getElementById('exp-payer').value.trim();
  if (desc && amount && payer) {
    const list = state.data.expenses || [];
    list.push({ desc, amount, payer });
    db.ref(`groups/${state.currentGroup}/expenses`).set(list);
  }
}

function handleRemoveExpense(idx) {
  const list = state.data.expenses || [];
  list.splice(idx, 1);
  db.ref(`groups/${state.currentGroup}/expenses`).set(list);
}

// --- MÓDULO FORO ---
function renderForo() {
  const topics = state.data.topics || [];
  return `
    <div class="card">
      <h3><i data-feather="message-square" class="accent"></i> Foro & Debates</h3>
      <p class="hint">Propón temas para discutir con el grupo.</p>

      <form onsubmit="handleAddTopic(event)" class="form-row" style="margin-top:20px;">
        <input type="text" id="topic-title" placeholder="Nuevo tema de conversación..." required />
        <button class="btn" type="submit"><i data-feather="send"></i> Publicar</button>
      </form>

      <ul class="topics-list">
        ${topics.length === 0 ? '<li class="hint italic">No hay temas abiertos actualmente.</li>' : ''}
        ${topics.map((t, idx) => `
          <li>
            <div class="foro-head">
              <b>${t.title}</b>
              <button class="btn btn-ghost btn-xs" onclick="handleRemoveTopic(${idx})"><i data-feather="x"></i></button>
            </div>
          </li>
        `).join('')}
      </ul>
    </div>
  `;
}

function handleAddTopic(e) {
  e.preventDefault();
  const input = document.getElementById('topic-title');
  if (input && input.value.trim()) {
    const list = state.data.topics || [];
    list.push({ title: input.value.trim() });
    db.ref(`groups/${state.currentGroup}/topics`).set(list);
  }
}

function handleRemoveTopic(idx) {
  const list = state.data.topics || [];
  list.splice(idx, 1);
  db.ref(`groups/${state.currentGroup}/topics`).set(list);
}

// --- MÓDULO TRIVIA ---
function renderTrivia() {
  return `
    <div class="card">
      <h3><i data-feather="award" class="accent"></i> Trivia del Grupo</h3>
      <div class="trivia-q">
        <span>¿Quién es el rey del asado en el grupo?</span>
        <span class="trivia-timer">30s</span>
      </div>
      <div class="trivia-opts">
        <button class="btn btn-opt" onclick="alert('¡Respuesta registrada!')">A) El que trae la carne</button>
        <button class="btn btn-opt" onclick="alert('¡Respuesta registrada!')">B) El que prende el fuego</button>
        <button class="btn btn-opt" onclick="alert('¡Respuesta registrada!')">C) El que crítica el punto de cocción</button>
        <button class="btn btn-opt" onclick="alert('¡Respuesta registrada!')">D) El que llega tarde a comer</button>
      </div>
    </div>
  `;
}

// --- MÓDULO PODIO & ESTADÍSTICAS ---
function renderPodio() {
  return `
    <div class="card">
      <h3><i data-feather="bar-chart-2" class="accent"></i> Podio de Asistencia</h3>
      <p class="hint">Ranking histórico basado en la constancia de asistencia.</p>

      <div class="podium">
        <div class="podium-slot">
          <div class="podium-medal">🥈</div>
          <div class="podium-names">Pedro</div>
          <div class="podium-bar tier-2" style="height: 120px;">
            <span class="podium-pct">85%</span>
          </div>
        </div>
        <div class="podium-slot">
          <div class="podium-medal">🥇</div>
          <div class="podium-names">Juan</div>
          <div class="podium-bar tier-1" style="height: 160px;">
            <span class="podium-pct">98%</span>
          </div>
        </div>
        <div class="podium-slot">
          <div class="podium-medal">🥉</div>
          <div class="podium-names">Lucas</div>
          <div class="podium-bar tier-3" style="height: 90px;">
            <span class="podium-pct">70%</span>
          </div>
        </div>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
