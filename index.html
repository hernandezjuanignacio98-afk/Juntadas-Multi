<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Juntadas Sub</title>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
<style>
:root{
  /* Paleta de colores refinada y profesional */
  --bg: #101218;
  --panel: #161922;
  --panel-border: #2a2e3b;
  --text: #f0f1f5;
  --text-dim: #9ca3af;
  
  /* Acento principal */
  --accent: #ff5722; /* Un naranja más vibrante */
  --accent-soft: rgba(255, 87, 34, 0.1);
  
  /* Colores de estado */
  --gold: #ffc107;
  --blue: #2196f3;
  --red: #ef4444;
  --green: #10b981;
  
  /* Sombras y profundidad */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  
  /* Bordes */
  --radius: 16px;
  --radius-sm: 8px;
}

*{box-sizing:border-box;}

html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}

body{
  /* Tipografía moderna y limpia */
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding: 40px 20px 80px; /* Más espacio */
}

#root{max-width:1080px;margin:0 auto;} /* Ligeramente más ancho */

/* --- Loading Screen --- */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:120px 0;color:var(--text-dim);}
.loading-screen .flame{font-size:64px; margin-bottom: 20px; animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.6;}50%{transform:scale(1.1);opacity:1;}}

/* --- App Header --- */
.app-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:20px;
  margin-bottom:40px; /* Más espacio */
  padding-bottom: 20px;
  border-bottom: 1px solid var(--panel-border);
}
.logo{
  font-size:28px; /* Más grande */
  font-weight:900; /* Más grueso */
  letter-spacing:-0.03em; /* Más moderno */
  text-transform:none; /* Sin mayúsculas forzadas */
  display:flex;
  align-items:center;
  gap:12px;
}
.auth-box{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--text-dim);}
.login-form{gap:10px;}
.login-form select, .login-form input{
  background:var(--panel);
  border:1px solid var(--panel-border);
  color:var(--text);
  border-radius:var(--radius-sm);
  padding:10px 16px;
  font-size:14px;
  transition: border-color 0.2s;
}
.login-form select:focus, .login-form input:focus {
  outline: none;
  border-color: var(--accent);
}
.login-error{width:100%;text-align:right;color:var(--red);font-size:13px;margin-top:-8px;margin-bottom:12px;}
.admin-tag{
  background:var(--gold);
  color:#1a1100;
  border-radius:4px; /* Menos redondeado */
  padding:4px 8px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.05em;
  vertical-align: middle;
}
.banner-warn{
  background:rgba(239, 68, 68, 0.1);
  border:1px solid rgba(239, 68, 68, 0.3);
  color:var(--text);
  padding:16px 20px;
  border-radius:var(--radius-sm);
  font-size:14px;
  margin-bottom:24px;
}

/* --- Tabs / Nav --- */
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px;}
.tab{
  background:var(--panel);
  border:1px solid var(--panel-border);
  color:var(--text);
  padding:12px 24px;
  border-radius:var(--radius);
  font-weight:600;
  font-size:14px;
  letter-spacing: normal;
  text-transform:none; /* Sin mayúsculas forzadas */
  cursor:pointer;
  transition: all 0.2s ease;
  box-shadow: var(--shadow-sm);
}
.tab:hover{
  background:rgba(255, 255, 255, 0.03);
  border-color:var(--accent);
}
.tab.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
  box-shadow: 0 4px 12px rgba(255, 87, 34, 0.3);
}

/* --- Cards --- */
.card{
  background:var(--panel);
  border:1px solid var(--panel-border);
  border-radius:var(--radius);
  padding:24px 30px; /* Más padding */
  margin-bottom:20px;
  box-shadow: var(--shadow-md);
}
.card h3{
  margin:0 0 16px;
  font-size:18px; /* Más grande */
  letter-spacing:-0.02em;
  text-transform:none;
  font-weight:800;
}
.record-card{
  font-size:15px;
  border-left: 4px solid var(--green); /* Indicador visual */
}
.blacklist-card{
  background:rgba(239, 68, 68, 0.03);
  border-color:rgba(239, 68, 68, 0.2);
}
.container-card{
  border-left: 4px solid #fff;
}
.names-line{font-size:16px;margin:10px 0; font-weight: 500;}
.hint{color:var(--text-dim);font-size:14px;margin:8px 0 0;line-height:1.6;}
.hint.italic{font-style:italic;}
.dim{color:var(--text-dim);}
.accent{color:var(--accent);font-weight:700;}
.blue{color:var(--blue);}
.green{color:var(--green);font-weight:700;}
.red{color:var(--red);font-weight:700;}
.link{
  color:var(--blue);
  cursor:pointer;
  text-decoration:none;
  font-size:14px;
  transition: color 0.2s;
}
.link:hover{color:#64b5f6; text-decoration: underline;}
.del-link{text-decoration:none;font-size:18px; opacity: 0.6; transition: opacity 0.2s;}
.del-link:hover{opacity: 1; text-decoration: none;}

/* --- Tables --- */
.table-wrap{overflow-x:auto; margin: 0 -10px; padding: 0 10px;}
table{border-collapse:collapse;width:100%;font-size:14px; min-width: 500px;}

table.board th, table.board td{padding:16px;text-align:left;border-bottom:1px solid var(--panel-border);white-space:nowrap;}
table.board thead th{
  color:var(--text-dim);
  font-weight:600;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
  background: rgba(255, 255, 255, 0.01);
}
td.name{font-weight:600;}
table.board tbody tr:hover{background:rgba(255, 255, 255, 0.01);}

table.planilla{border-collapse:collapse;}
table.planilla th, table.planilla td{padding:12px;text-align:center;border-bottom:1px solid var(--panel-border);font-size:13px;}
table.planilla thead th{color:var(--text-dim);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.08em;white-space:nowrap;}
.sticky-col{position:sticky;left:0;background:var(--panel);text-align:left !important;white-space:nowrap;padding-right:20px !important;font-weight:600;}

/* --- Badges & Cells --- */
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;font-size:14px;color:#fff;
  box-shadow: var(--shadow-sm);
}
.st-presente{background:var(--green);}
.st-anfitrion{background:var(--gold);color:#1a1100;}
.st-avisado{background:var(--blue);}
.st-sinavisar{background:var(--red);}

.cell-td{position:relative; transition: background 0.2s;}
.cell-td.clickable{cursor:pointer;}
.cell-td.clickable:hover{background:rgba(255, 255, 255, 0.03);}
.cell-td.clickable:hover .badge{transform: scale(1.1); outline:2px solid var(--text);}
.motivo-dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:#fff; border: 1px solid #000;}

/* --- Editing Cell --- */
.edit-td{background: rgba(255, 255, 255, 0.02);}
.edit-cell{display:flex;flex-direction:column;gap:10px;min-width:200px;padding:8px;}
.edit-cell select, .edit-cell input{
  background:var(--bg);border:1px solid var(--panel-border);color:var(--text);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;width:100%;
}
.edit-actions{display:flex;gap:8px;}

/* --- Legend --- */
.legend{display:flex;flex-wrap:wrap;gap:20px;margin-top:20px;padding-top:20px; border-top: 1px solid var(--panel-border); font-size:13px;color:var(--text-dim);}
.legend-item{display:flex;align-items:center;gap:10px;}
.legend .badge{width:24px;height:24px;font-size:11px;}
.legend .motivo-dot{position:static; border: none;}

/* --- Forms & Buttons --- */
.form-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
.form-row input, .form-row select{
  background:var(--bg);border:1px solid var(--panel-border);color:var(--text);
  border-radius:var(--radius-sm);padding:12px 16px;font-size:14px;flex:1;min-width:160px;
  transition: all 0.2s;
}
.form-row input:focus, .form-row select:focus {
  outline: none;
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.01);
}

.btn{
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:var(--radius-sm);
  padding:12px 24px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  letter-spacing:normal;
  transition: all 0.2s;
  box-shadow: var(--shadow-sm);
}
.btn:hover{filter:brightness(1.1); transform: translateY(-1px); box-shadow: var(--shadow-md);}
.btn:active{transform: translateY(0px); box-shadow: var(--shadow-sm);}

.btn-sm{padding:10px 20px;font-size:13px;}
.btn-xs{padding:8px 16px;font-size:12px;}
.btn-ghost{background:transparent;border:1px solid var(--panel-border);color:var(--text-dim);}
.btn-ghost:hover{background: rgba(255, 255, 255, 0.03); color: var(--text); border-color: var(--text-dim);}

.btn-opt{background:var(--panel);border:1px solid var(--panel-border);color:var(--text); padding: 16px; font-weight: 600; text-align: left;}
.btn-opt:hover{border-color:var(--accent); background:rgba(255, 255, 255, 0.03);}

/* --- External & Lists --- */
.ext-log, .container-list, .topics-list, .settlements, .comments{list-style:none;padding:0;margin:16px 0 0;font-size:14px;}
.ext-log li, .container-list li, .topics-list li, .settlements li, .comments li{
  padding:12px 0;
  border-bottom:1px solid var(--panel-border);
  line-height: 1.6;
}
.ext-log li:last-child, .container-list li:last-child, .topics-list li:last-child, .settlements li:last-child, .comments li:last-child{border-bottom:none;}

/* --- Foro --- */
.foro-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:16px;font-size:15px; padding-bottom: 12px; border-bottom: 1px solid var(--panel-border);}
.comments{margin:0 0 16px;}
.comments li{padding:10px 0; border-bottom-style: solid; border-color: var(--panel-border);}

/* --- Trivia --- */
.trivia-q{font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:12px; line-height: 1.5; margin-bottom: 20px;}
.trivia-timer{background:var(--accent);color:#fff;border-radius:var(--radius-sm);padding:6px 12px;font-size:14px;font-weight:800; font-variant-numeric: tabular-nums;}
.trivia-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
@media(max-width:520px){.trivia-opts{grid-template-columns:1fr;}}

/* --- Container & Debates --- */
.participants-actions{display:flex;flex-wrap:wrap; gap:16px;margin-top:12px;}
.participants-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:16px;}
.participant-chip{
  display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--panel-border);
  border-radius:var(--radius-sm);padding:10px 16px;font-size:14px;cursor:pointer;user-select:none; transition: all 0.2s;
}
.participant-chip:hover {border-color: var(--text-dim);}
.participant-chip input{accent-color:var(--accent);width:16px;height:16px; margin: 0;}

.person-debts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;}
@media(max-width:600px){.person-debts{grid-template-columns:1fr;}}
.person-debt-block{background:var(--bg);border:1px solid var(--panel-border);border-radius:var(--radius-sm);padding:16px 20px;}
.person-debt-name{font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px; border-bottom: 1px solid var(--panel-border); padding-bottom: 8px;}
.debt-line{font-size:14px;padding:4px 0;color:var(--text-dim);}
.debt-line b{color:var(--text); font-weight: 600;}

.reset-card{text-align:center; margin-top: 40px; padding: 20px; background: none; border: none; box-shadow: none;}

/* --- RSVP --- */
.rsvp-vote-row{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap;}
.rsvp-active-si{background:var(--green);color:#fff;border:none;}
.rsvp-active-tal{background:var(--gold);color:#1a1100;border:none;}
.rsvp-active-no{background:var(--red);color:#fff;border:none;}
.rsvp-lists{display:flex;flex-direction:column;gap:8px;margin:16px 0;font-size:14px; line-height: 1.6;}
.rsvp-group{color:var(--text-dim);}
.rsvp-admin-box{margin-top:20px;padding-top:20px;border-top:1px solid var(--panel-border);}

/* --- Fin de semana --- */
.notas-box{width:100%;background:var(--bg);border:1px solid var(--panel-border);color:var(--text);border-radius:var(--radius-sm);padding:12px;font-size:14px;min-height:80px;margin-bottom:10px;font-family:inherit; line-height: 1.6;}
.finde-notas{font-size:14px;color:var(--text-dim);font-style:italic;margin:12px 0;line-height:1.6;}
.finde-chips{margin-top:16px;font-size:14px;}
.finde-chips b {display: inline-block; margin-bottom: 8px;}
.chip{display:inline-block;padding:6px 14px;border-radius:var(--radius);margin:4px 6px 4px 0;font-size:12px; font-weight: 600;}
.chip-green{background:rgba(16, 185, 129, 0.15);color:var(--green);}
.chip-red{background:rgba(239, 68, 68, 0.15);color:var(--red);}
.chip-clickable{cursor:pointer; transition: all 0.2s;}
.chip-clickable:hover{transform: translateY(-1px); box-shadow: var(--shadow-sm);}

/* --- Container Etiquetas --- */
.tag-auto{background:rgba(239, 68, 68, 0.15);color:var(--red);font-size:11px;border-radius:4px;padding:3px 8px;margin-left:10px; font-weight: 700;}
.tag-voted{background:rgba(255, 193, 7, 0.15);color:var(--gold);font-size:11px;border-radius:4px;padding:3px 8px;margin-left:10px; font-weight: 700;}

/* --- Evolución Gráfico --- */
.evo-chart{width:100%;height:200px;display:block; margin-top: 10px;}

/* --- Debates --- */
.debate-block{background:var(--bg);border:1px solid var(--panel-border);border-radius:var(--radius-sm);padding:20px;margin-bottom:16px; box-shadow: var(--shadow-sm);}
.debate-block:last-child{margin-bottom:0;}
.debate-head{font-size:14px;margin-bottom:8px; line-height: 1.5;}
.debate-reason{font-size:15px;font-style:italic;color:var(--text);margin:12px 0 16px;line-height:1.6; padding-left: 10px; border-left: 2px solid var(--accent);}
.btn-debate-si{background:var(--accent);color:#fff;border:none;}
.btn-debate-no{background:var(--green);color:#fff;border:none;}

/* --- Estadísticas Podio --- */
.podium{display:flex;gap:16px;align-items:flex-end;justify-content:center;margin-top:30px; padding: 0 10px;}
.podium-slot{flex:1;max-width:180px;text-align:center;}
.podium-medal{font-size:36px;margin-bottom:10px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5));}
.podium-names{font-size:14px;font-weight:700;margin-bottom:12px;min-height:40px;letter-spacing:-0.01em; line-height: 1.4; color: var(--text);}
.podium-bar{
  border-radius:12px 12px 6px 6px;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:16px;
  box-shadow:0 8px 25px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15);
  position: relative;
  overflow: hidden;
}
/* Efecto de brillo en las barras */
.podium-bar::after {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 100%; height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
}

.podium-pct{font-size:24px;font-weight:900;letter-spacing:-0.02em; position: relative; z-index: 1;}

.podium-bar.tier-1{background:linear-gradient(180deg,#fff1b8 0%,#f0b429 60%,#b88a14 100%);color:#3a2400; border: 1px solid #ffe082;}
.podium-bar.tier-2{background:linear-gradient(180deg,#f1f5f9 0%,#cbd5e1 60%,#94a3b8 100%);color:#1e293b; border: 1px solid #e2e8f0;}
.podium-bar.tier-3{background:linear-gradient(180deg,#ffdec7 0%,#f19e62 60%,#c17239 100%);color:#3a1d0a; border: 1px solid #ffccab;}

/* --- Multi-grupo Landing --- */
.landing-wrap{max-width:500px;margin:60px auto;}
.landing-logo{justify-content:center;font-size:32px;margin-bottom:10px;}
.landing-sub{text-align:center;margin-bottom:30px; font-size: 16px;}
.group-name-tag{font-size:14px;font-weight:600;color:var(--text-dim);text-transform:none;letter-spacing:0;margin-left:10px; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px;}
.member-actions{font-size:12px;margin-left:10px;}

/* --- Theme Selector --- */
.theme-swatches{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap;}
.theme-swatch{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0; transition: all 0.2s; box-shadow: var(--shadow-sm);}
.theme-swatch:hover{transform: scale(1.1); box-shadow: var(--shadow-md);}
.theme-swatch-active{border-color:var(--text); box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--accent);}

/* --- Mode Toggle --- */
.mode-toggle{display:flex;gap:10px;margin-top:16px;}

/* --- Header Right --- */
.header-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.home-link{white-space:nowrap; font-weight: 500;}
.my-groups-list{list-style:none;padding:0;margin:12px 0 0;}
.my-groups-list li{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--panel-border);font-size:15px;}
.my-groups-list li:last-child{border-bottom:none;}
.my-group-link{color:var(--text);font-weight:700;cursor:pointer;text-decoration:none; transition: color 0.2s;}
.my-group-link:hover{color:var(--accent);}
.my-group-forget{font-size:12px;}

/* Media Queries */
@media(max-width:600px){
  body {padding: 20px 10px 60px;}
  .app-header{flex-direction:column;align-items:flex-start; gap: 10px;}
  .logo{font-size:22px;}
  .card {padding: 16px 20px;}
  .podium {gap: 8px;}
  .podium-names {font-size: 12px; min-height: 34px;}
  .podium-pct {font-size: 18px;}
}
