<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Juntadas Sub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
<style>
/* =========================================================
   JUNTADAS SUB — Diseño premium (pasada 2: pulido)
   Variables → Reset → Layout → Componentes → Utilidades → Responsive
   ========================================================= */

:root{
  --bg:#0B1220;
  --panel:#111827;
  --panel-hover:#172033;
  --panel-border:rgba(255,255,255,.08);
  --text:#E7EAF0;
  --text-dim:#9FADC2;

  --accent:#4F8CFF;
  --accent-soft:rgba(79,140,255,.14);
  --accent-hover:#6EA8FE;

  --violet:#7C3AED;
  --teal:#14B8A6;
  --gold:#F59E0B;
  --blue:#6EA8FE;
  --red:#EF4444;
  --green:#22C55E;

  --radius-sm:10px;
  --radius:16px;
  --radius-lg:22px;

  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;

  --shadow-xs:0 1px 2px rgba(0,0,0,.18);
  --shadow-sm:0 1px 2px rgba(0,0,0,.16),0 3px 8px rgba(0,0,0,.14);
  --shadow-md:0 2px 6px rgba(0,0,0,.18),0 10px 24px rgba(0,0,0,.22);
  --shadow-lg:0 4px 12px rgba(0,0,0,.22),0 20px 48px rgba(0,0,0,.3);
  --focus-ring:0 0 0 3px rgba(79,140,255,.4);

  --font-sans:'Inter','Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:var(--font-sans);
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(0,0,.2,1);
}

/* ============ RESET ============ */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
button,input,select,textarea{font-family:inherit;}
ul{margin:0;}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

/* ============ LAYOUT BASE ============ */
html,body{background:var(--bg);color:var(--text);}
body{
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  padding:0;
  line-height:1.5;
  transition:background .25s var(--ease),color .25s var(--ease);
}
#root{max-width:1400px;margin:0 auto;}

.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:120px 0;color:var(--text-dim);}
.loading-screen .flame{font-size:52px;margin-bottom:var(--sp-4);animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.55;}50%{transform:scale(1.1);opacity:1;}}

/* ============ APP SHELL: SIDEBAR + MAIN ============ */
.app-shell{display:flex;min-height:100vh;align-items:stretch;}

.sidebar{
  width:248px;flex-shrink:0;
  display:flex;flex-direction:column;
  background:rgba(17,24,39,.75);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border-right:1px solid var(--panel-border);
  padding:24px 16px;
  position:sticky;top:0;height:100vh;
  gap:var(--sp-4);
}
.sidebar-top{padding:0 8px;}
.logo{font-size:18px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:var(--sp-2);font-family:var(--font-display);}
.sidebar-group-name{margin-top:var(--sp-2);display:inline-block;}
.group-name-tag{
  font-size:11.5px;font-weight:600;color:var(--text-dim);
  background:rgba(255,255,255,.05);padding:4px 10px;border-radius:999px;
}
.sidebar-home{padding:0 8px;font-size:12px;}

.sidebar-tabs{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
.tab{
  background:transparent;border:1px solid transparent;color:var(--text-dim);
  padding:10px 12px;border-radius:var(--radius-sm);font-weight:600;font-size:13px;
  cursor:pointer;transition:background .16s var(--ease),color .16s var(--ease);
  display:flex;align-items:center;gap:10px;text-align:left;width:100%;
}
.tab-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
.tab:hover{background:rgba(255,255,255,.05);color:var(--text);}
.tab:focus-visible{outline:none;box-shadow:var(--focus-ring);}
.tab.active{background:var(--accent-soft);color:var(--accent-hover);}

.sidebar-bottom{border-top:1px solid var(--panel-border);padding-top:var(--sp-4);}
.sidebar-user{display:flex;align-items:center;gap:var(--sp-2);}
.sidebar-user-info{flex:1;min-width:0;}
.sidebar-user-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-logout{font-size:16px;}
.sidebar-login{display:flex;flex-direction:column;gap:var(--sp-2);}
.sidebar-login select,.sidebar-login input{
  background:var(--panel);border:1px solid var(--panel-border);color:var(--text);
  border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;width:100%;
  transition:border-color .18s var(--ease),background .18s var(--ease),box-shadow .18s var(--ease);
}
.sidebar-login select:focus-visible,.sidebar-login input:focus-visible{outline:none;border-color:var(--accent);background:var(--panel-hover);box-shadow:var(--focus-ring);}
.login-error{color:var(--red);font-size:11.5px;}

.main-area{flex:1;min-width:0;padding:28px 32px 64px;}

.dashboard-grid{display:grid;grid-template-columns:1fr 1.6fr;gap:0 16px;align-items:start;}
@media(max-width:900px){.dashboard-grid{grid-template-columns:1fr;}}
.dashboard-col{display:flex;flex-direction:column;min-width:0;}
.dashboard-col-wide{min-width:0;}
.home-link{white-space:nowrap;}

.avatar{
  width:30px;height:30px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;flex-shrink:0;
  box-shadow:var(--shadow-xs),inset 0 0 0 1px rgba(255,255,255,.14);
}
.avatar-photo{object-fit:cover;background:var(--panel);}
.photo-upload-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:50%;background:var(--panel-hover);
  border:1px solid var(--panel-border);cursor:pointer;font-size:12px;
  transition:border-color .15s var(--ease),transform .15s var(--ease-out);
}
.photo-upload-btn:hover{border-color:var(--accent);transform:scale(1.06);}

.admin-tag{
  background:linear-gradient(135deg,var(--gold),#d18a06);
  color:#231600;border-radius:999px;padding:3px 10px;font-size:10px;
  font-weight:800;letter-spacing:.04em;box-shadow:var(--shadow-xs);
}
.banner-warn{
  background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--text);
  padding:14px 18px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:var(--sp-4);
}

/* ============ NAV / TABS ============ */
.tabs{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-bottom:var(--sp-5);}
.tab{
  background:var(--panel);border:1px solid var(--panel-border);color:var(--text-dim);
  padding:10px 18px;border-radius:999px;font-weight:600;font-size:12.5px;
  cursor:pointer;transition:background .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease);
}
.tab:hover{border-color:var(--accent);color:var(--text);background:var(--panel-hover);}
.tab:focus-visible{outline:none;box-shadow:var(--focus-ring);}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 10px var(--accent-soft);}

/* ============ CARDS ============ */
.card{
  background:rgba(17,24,39,.72);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid var(--panel-border);
  border-radius:var(--radius);
  padding:22px 26px;
  margin-bottom:var(--sp-4);
  box-shadow:var(--shadow-xs);
  animation:fadeIn .22s var(--ease-out);
}
.card h3{margin:0 0 var(--sp-3);font-size:14.5px;letter-spacing:-.005em;font-weight:700;display:flex;align-items:center;gap:var(--sp-2);font-family:var(--font-display);}
.record-card{font-size:13.5px;border-left:3px solid var(--green);}
.blacklist-card{background:rgba(239,68,68,.05);border-color:rgba(239,68,68,.25);}
.container-card{border-left:3px solid var(--gold);}
.names-line{font-size:14px;margin:var(--sp-2) 0;font-weight:500;}
.hint{color:var(--text-dim);font-size:12.5px;margin:6px 0 0;line-height:1.6;}
.hint.italic{font-style:italic;}
.dim{color:var(--text-dim);}
.accent{color:var(--accent);font-weight:700;}
.blue{color:var(--blue);}
.green{color:var(--green);font-weight:700;}
.red{color:var(--red);font-weight:700;}
.link{color:var(--accent-hover);cursor:pointer;text-decoration:none;font-size:12.5px;transition:color .15s var(--ease);}
.link:hover{color:var(--accent);text-decoration:underline;}
.del-link{text-decoration:none;font-size:15px;opacity:.5;transition:opacity .15s var(--ease),transform .15s var(--ease);display:inline-block;}
.del-link:hover{opacity:1;transform:scale(1.08);}

@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.quick-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-4);}
.stat-card{
  background:rgba(17,24,39,.72);border:1px solid var(--panel-border);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow-xs);transition:border-color .18s var(--ease);
}
.stat-card:hover{border-color:rgba(255,255,255,.14);}
.stat-card .stat-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
.stat-card .stat-value{font-size:19px;font-weight:800;margin-top:6px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;font-family:var(--font-display);}

/* ============ TABLES ============ */
.table-wrap{overflow-x:auto;}
table{border-collapse:collapse;width:100%;font-size:13px;}
table.board th,table.board td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--panel-border);white-space:nowrap;}
table.board thead th{color:var(--text-dim);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.07em;}
table.board tbody tr{transition:background .15s var(--ease);}
table.board tbody tr:hover{background:rgba(255,255,255,.025);}
td.name{font-weight:700;}
td,th{font-variant-numeric:tabular-nums;}

table.planilla{border-collapse:collapse;}
table.planilla th,table.planilla td{padding:9px 7px;text-align:center;border-bottom:1px solid var(--panel-border);font-size:11.5px;}
table.planilla thead th{color:var(--text-dim);font-weight:700;text-transform:uppercase;font-size:9.5px;letter-spacing:.05em;white-space:nowrap;}
.sticky-col{position:sticky;left:0;background:var(--panel);text-align:left !important;white-space:nowrap;padding-right:16px !important;font-weight:700;}

.badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:27px;height:27px;border-radius:50%;font-size:13px;color:#fff;
  box-shadow:var(--shadow-xs);transition:transform .15s var(--ease-out),outline-color .15s var(--ease);
}
.st-presente{background:var(--green);}
.st-anfitrion{background:var(--gold);color:#241600;}
.st-avisado{background:var(--blue);}
.st-sinavisar{background:var(--red);}
.cell-td{position:relative;transition:background .15s var(--ease);}
.cell-td.clickable{cursor:pointer;}
.cell-td.clickable:hover{background:rgba(255,255,255,.035);}
.cell-td.clickable:hover .badge{outline:2px solid var(--text);transform:scale(1.1);}
.motivo-dot{position:absolute;top:5px;right:12px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.4);}

.edit-td{background:var(--accent-soft);}
.edit-cell{display:flex;flex-direction:column;gap:var(--sp-2);min-width:180px;padding:6px;}
.edit-cell select,.edit-cell input{
  background:var(--bg);border:1px solid var(--panel-border);color:var(--text);
  border-radius:var(--radius-sm);padding:7px 9px;font-size:12px;width:100%;
}
.edit-actions{display:flex;gap:var(--sp-2);}

.legend{display:flex;flex-wrap:wrap;gap:var(--sp-4);margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid var(--panel-border);font-size:11.5px;color:var(--text-dim);}
.legend-item{display:flex;align-items:center;gap:var(--sp-2);}
.legend .badge{width:20px;height:20px;font-size:9.5px;}
.legend .motivo-dot{position:static;box-shadow:none;}

/* ============ FORMS & BUTTONS ============ */
.form-row{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;}
.form-row input,.form-row select{
  background:var(--bg);border:1px solid var(--panel-border);color:var(--text);
  border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;flex:1;min-width:150px;
  transition:border-color .18s var(--ease),background .18s var(--ease),box-shadow .18s var(--ease);
}
.form-row input:focus-visible,.form-row select:focus-visible{outline:none;border-color:var(--accent);background:var(--panel-hover);box-shadow:var(--focus-ring);}

.btn{
  background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:11px 20px;font-weight:700;font-size:13px;cursor:pointer;min-height:40px;
  transition:filter .15s var(--ease),transform .1s var(--ease-out),box-shadow .15s var(--ease);
  box-shadow:var(--shadow-xs);
}
.btn:hover{filter:brightness(1.08);box-shadow:0 3px 10px var(--accent-soft);}
.btn:active{transform:scale(.97);filter:brightness(.98);}
.btn:focus-visible{outline:none;box-shadow:var(--focus-ring);}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none;box-shadow:none;}
.btn-sm{padding:9px 16px;font-size:12px;min-height:36px;}
.btn-xs{padding:6px 12px;font-size:11px;min-height:30px;}
.btn-ghost{background:transparent;border:1px solid var(--panel-border);color:var(--text-dim);box-shadow:none;}
.btn-ghost:hover{background:rgba(255,255,255,.04);color:var(--text);border-color:var(--text-dim);filter:none;}
.btn-opt{background:var(--panel);border:1px solid var(--panel-border);color:var(--text);text-align:left;}
.btn-opt:hover{border-color:var(--accent);background:var(--panel-hover);filter:none;}

/* ============ LISTAS ============ */
.ext-log,.container-list,.topics-list,.settlements,.comments{list-style:none;padding:0;margin:var(--sp-4) 0 0;font-size:13px;}
.ext-log li,.container-list li,.topics-list li,.settlements li{
  padding:10px 0;border-bottom:1px dashed var(--panel-border);line-height:1.6;
}
.ext-log li:last-child,.container-list li:last-child,.topics-list li:last-child,.settlements li:last-child{border-bottom:none;}

/* ============ FORO ============ */
.foro-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:var(--sp-2);margin-bottom:var(--sp-3);font-size:13.5px;padding-bottom:10px;border-bottom:1px solid var(--panel-border);}
.comments{margin:0 0 var(--sp-4);display:flex;flex-direction:column;gap:2px;}
.comment-row{display:flex;gap:var(--sp-3);padding:8px 0;align-items:flex-start;}
.comment-bubble{
  background:var(--panel-hover);border:1px solid var(--panel-border);border-radius:var(--radius-sm);
  padding:9px 13px;font-size:13px;line-height:1.55;flex:1;
}
.comment-author{font-weight:700;font-size:12px;margin-bottom:2px;color:var(--text);}

/* ============ TRIVIA ============ */
.trivia-q{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);}
.trivia-timer{background:var(--accent);color:#fff;border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;}
.trivia-opts{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-top:var(--sp-4);}
@media(max-width:520px){.trivia-opts{grid-template-columns:1fr;}}
.trivia-bar-row{display:flex;align-items:center;gap:var(--sp-3);padding:7px 0;}
.trivia-bar-name{width:90px;font-size:12px;font-weight:700;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.trivia-bar-track{flex:1;height:9px;background:var(--panel-border);border-radius:999px;overflow:hidden;}
.trivia-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hover));border-radius:999px;transition:width .45s var(--ease-out);}
.trivia-bar-score{width:24px;text-align:right;font-size:12px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;}

/* ============ CONTAINER / DEBATES / GASTOS ============ */
.participants-actions{display:flex;flex-wrap:wrap;gap:var(--sp-4);margin-top:var(--sp-2);}
.participants-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:var(--sp-2);margin-top:var(--sp-3);}
.participant-chip{
  display:flex;align-items:center;gap:var(--sp-2);background:var(--bg);border:1px solid var(--panel-border);
  border-radius:var(--radius-sm);padding:9px 12px;font-size:12px;cursor:pointer;user-select:none;transition:border-color .15s var(--ease),background .15s var(--ease);
}
.participant-chip:hover{border-color:var(--text-dim);}
.participant-chip input{accent-color:var(--accent);width:14px;height:14px;}

.person-debts{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-top:var(--sp-4);}
@media(max-width:560px){.person-debts{grid-template-columns:1fr;}}
.person-debt-block{background:var(--bg);border:1px solid var(--panel-border);border-radius:var(--radius-sm);padding:14px 16px;}
.person-debt-name{font-weight:800;font-size:12.5px;letter-spacing:.02em;margin-bottom:var(--sp-2);}
.debt-line{font-size:12px;padding:3px 0;color:var(--text-dim);font-variant-numeric:tabular-nums;}
.debt-line b{color:var(--text);}

.reset-card{text-align:center;}

.debate-block{background:var(--bg);border:1px solid var(--panel-border);border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:var(--sp-3);transition:border-color .2s var(--ease);}
.debate-block:last-child{margin-bottom:0;}
.debate-head{font-size:13px;margin-bottom:6px;}
.debate-reason{font-size:13px;font-style:italic;color:var(--text-dim);margin:6px 0 10px;line-height:1.55;}
.btn-debate-si{background:var(--red);color:#fff;border:none;}
.btn-debate-no{background:var(--green);color:#fff;border:none;}

.tag-auto{background:rgba(239,68,68,.16);color:var(--red);font-size:9.5px;border-radius:999px;padding:3px 9px;margin-left:8px;font-weight:700;}
.tag-voted{background:rgba(245,158,11,.16);color:var(--gold);font-size:9.5px;border-radius:999px;padding:3px 9px;margin-left:8px;font-weight:700;}

/* ============ RSVP ============ */
.rsvp-vote-row{display:flex;gap:var(--sp-2);margin:var(--sp-3) 0;flex-wrap:wrap;}
.rsvp-active-si{background:var(--green);color:#fff;border:none;}
.rsvp-active-tal{background:var(--gold);color:#241600;border:none;}
.rsvp-active-no{background:var(--red);color:#fff;border:none;}
.rsvp-lists{display:flex;flex-direction:column;gap:6px;margin:var(--sp-3) 0;font-size:12.5px;}
.rsvp-group{color:var(--text-dim);}
.rsvp-admin-box{margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid var(--panel-border);}

/* ============ FIN DE SEMANA ============ */
.notas-box{
  width:100%;background:var(--bg);border:1px solid var(--panel-border);color:var(--text);
  border-radius:var(--radius-sm);padding:10px;font-size:13px;min-height:64px;margin-bottom:var(--sp-2);
  font-family:inherit;line-height:1.6;transition:border-color .18s var(--ease);
}
.notas-box:focus-visible{outline:none;border-color:var(--accent);box-shadow:var(--focus-ring);}
.finde-notas{font-size:12.5px;color:var(--text-dim);font-style:italic;margin:var(--sp-3) 0;line-height:1.6;}
.finde-chips{margin-top:var(--sp-4);font-size:12.5px;}
.chip{display:inline-block;padding:5px 12px;border-radius:999px;margin:3px 5px 3px 0;font-size:11px;font-weight:600;}
.chip-green{background:rgba(34,197,94,.14);color:var(--green);}
.chip-red{background:rgba(239,68,68,.14);color:var(--red);}
.chip-clickable{cursor:pointer;transition:transform .15s var(--ease-out),box-shadow .15s var(--ease);}
.chip-clickable:hover{transform:translateY(-1px);box-shadow:var(--shadow-xs);}

/* ============ ESTADÍSTICAS ============ */
.evo-chart{width:100%;height:200px;display:block;}

.podium{display:flex;gap:var(--sp-4);align-items:flex-end;justify-content:center;margin-top:var(--sp-5);padding:0 8px;}
.podium-slot{flex:1;max-width:160px;text-align:center;}
.podium-medal{font-size:28px;margin-bottom:var(--sp-2);filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));}
.podium-names{font-size:12.5px;font-weight:700;margin-bottom:var(--sp-3);min-height:34px;line-height:1.4;}
.podium-bar{
  border-radius:14px 14px 6px 6px;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:14px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,.15);
}
.podium-bar::after{
  content:'';position:absolute;top:0;left:0;width:100%;height:45%;
  background:linear-gradient(180deg,rgba(255,255,255,.12),transparent);
}
.podium-pct{font-size:19px;font-weight:900;position:relative;z-index:1;font-variant-numeric:tabular-nums;font-family:var(--font-display);}
.podium-bar.tier-1{background:linear-gradient(180deg,#fff1b8 0%,#f0b429 60%,#b88a14 100%);color:#3a2400;}
.podium-bar.tier-2{background:linear-gradient(180deg,#f1f5f9 0%,#cbd5e1 60%,#94a3b8 100%);color:#1e293b;}
.podium-bar.tier-3{background:linear-gradient(180deg,#ffdec7 0%,#f19e62 60%,#c17239 100%);color:#3a1d0a;}

/* ============ MULTI-GRUPO: LANDING ============ */
.landing-wrap{max-width:460px;margin:44px auto;}
.landing-logo{justify-content:center;font-size:24px;margin-bottom:var(--sp-2);}
.landing-sub{text-align:center;margin-bottom:var(--sp-5);font-size:13.5px;}
.member-actions{font-size:10.5px;margin-left:8px;}
.member-row{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;}

/* ============ TEMA / MODO / VIBE ============ */
.vibe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--sp-2);margin:var(--sp-3) 0;}
.vibe-option{
  background:var(--bg);border:1px solid var(--panel-border);border-radius:var(--radius-sm);
  padding:10px 12px;cursor:pointer;text-align:left;transition:border-color .16s var(--ease),background .16s var(--ease);
  display:flex;flex-direction:column;gap:2px;
}
.vibe-option:hover{border-color:var(--text-dim);}
.vibe-option:focus-visible{outline:none;box-shadow:var(--focus-ring);}
.vibe-option-active{border-color:var(--accent);background:var(--accent-soft);}
.vibe-option-label{font-size:12.5px;font-weight:700;}
.vibe-option-soon{font-size:10px;color:var(--text-dim);font-style:italic;}
.mode-toggle{display:flex;gap:var(--sp-2);margin-top:var(--sp-3);}

/* Vibe: Cancha — íconos de "avisado"/"sin avisar" como tarjetas de árbitro */
.vibe-cards .st-avisado,.vibe-cards .st-sinavisar{
  border-radius:4px;width:19px;height:26px;box-shadow:var(--shadow-xs),0 0 0 1px rgba(0,0,0,.25);
}
.vibe-cards .st-avisado{color:#3a2b00;}

/* Vibe: Cancha — zona de clasificación en la tabla de posiciones (como en una tabla de fútbol real) */
.vibe-zonas .leaderboard-card table.board tbody tr:nth-child(-n+3) td:first-child{
  box-shadow:inset 3px 0 0 var(--green);
}

/* ============ MIS GRUPOS ============ */
.my-groups-list{list-style:none;padding:0;margin:var(--sp-3) 0 0;}
.my-groups-list li{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--panel-border);font-size:13.5px;}
.my-groups-list li:last-child{border-bottom:none;}
.my-group-link{display:flex;align-items:center;gap:var(--sp-2);color:var(--text);font-weight:700;cursor:pointer;text-decoration:none;transition:color .15s var(--ease);}
.my-group-link:hover{color:var(--accent);}
.my-group-forget{font-size:10.5px;}

/* ============ ACCESIBILIDAD ============ */
a:focus-visible,[onclick]:focus-visible{
  outline:none;box-shadow:var(--focus-ring);border-radius:4px;
}
::selection{background:var(--accent);color:#fff;}

/* ============ RESPONSIVE ============ */
@media(max-width:900px){
  .app-shell{flex-direction:column;}
  .sidebar{
    width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;
    align-items:center;padding:14px 16px;border-right:none;border-bottom:1px solid var(--panel-border);
  }
  .sidebar-top{padding:0;display:flex;align-items:center;gap:var(--sp-3);}
  .sidebar-tabs{flex-direction:row;flex:auto;overflow-x:auto;order:3;width:100%;padding-top:var(--sp-2);}
  .tab{flex-shrink:0;}
  .sidebar-home{padding:0;order:2;margin-left:auto;}
  .sidebar-bottom{border-top:none;padding-top:0;order:1;margin-left:auto;}
  .main-area{padding:20px 16px 56px;}
  .quick-stats{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:600px){
  .sidebar{padding:12px;}
  .logo{font-size:16px;}
  .logo span{display:none;}
  .card{padding:18px 18px;}
  .card h3{font-size:13.5px;}
  .podium{gap:8px;}
  .podium-names{font-size:11px;min-height:30px;}
  .podium-pct{font-size:16px;}
  .quick-stats{grid-template-columns:repeat(2,1fr);gap:8px;}
  .stat-card{padding:12px 14px;}
  .trivia-bar-name{width:64px;font-size:11px;}
  .sidebar-user-name{max-width:80px;}
}

<script>
/* ===================== JUNTADAS SUB — lógica ===================== */

let CORE_MEMBERS = []; // dinámico: se sincroniza con DB.members al renderizar (ver render())

function isAdmin(member) {
  return !!(DB && Array.isArray(DB.admins) && DB.admins.includes(member));
}

const MONTHS_ES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

const TOPIC_SUGGESTIONS = [
  { cat: "Fútbol", text: "¿Cómo ven el próximo Superclásico entre Boca y River?" },
  { cat: "Fútbol", text: "Estudiantes se consagró campeón del último Clausura — ¿se lo veían venir?" },
  { cat: "Fútbol", text: "¿La Selección debería convocar más jugadores del ascenso, o solo mirar Europa?" },
  { cat: "Fútbol", text: "¿Qué equipo argentino tiene más chances en el próximo Mundial de Clubes?" },
  { cat: "Fútbol", text: "Un crack se va a la MLS en su mejor momento: ¿jugada inteligente o error de carrera?" },
  { cat: "Espectáculos", text: "¿Vale la pena algún recital grande que esté pasando por Buenos Aires este mes?" },
  { cat: "Espectáculos", text: "¿Qué serie o película están viendo ahora que valga la pena recomendar?" },
  { cat: "Espectáculos", text: "¿Los realities de streaming se están comiendo a la tele tradicional?" },
  { cat: "Espectáculos", text: "¿Vieron alguna obra de teatro en Corrientes últimamente?" },
  { cat: "Actualidad", text: "¿La inteligencia artificial les cambió el laburo este último año, para bien o para mal?" },
  { cat: "Actualidad", text: "¿Comprarían un auto eléctrico hoy en Argentina, o todavía no está el país para eso?" },
  { cat: "Actualidad", text: "¿Cuál es la última app o herramienta que empezaron a usar y no pueden dejar?" },
  { cat: "Hipotéticos", text: "Si mañana se pudiera viajar gratis a cualquier lugar del mundo, ¿a dónde van todos juntos?" },
  { cat: "Hipotéticos", text: "¿Qué harían si se ganan la lotería mañana?" },
  { cat: "Hipotéticos", text: "¿Alguna vez pensaron en cambiar completamente de rubro laboral? ¿A qué se dedicarían?" },
  { cat: "Hipotéticos", text: "Si el grupo tuviera que armar un emprendimiento juntos, ¿cuál sería?" },
  { cat: "Nostalgia", text: "¿Cuál fue la mejor juntada de la historia del grupo y por qué?" },
  { cat: "Nostalgia", text: "¿Cuál era el boliche o bar al que más iban hace 10 años y ya no existe?" },
  { cat: "Nostalgia", text: "¿Se acuerdan de la primera vez que se juntaron todos? ¿Cómo fue?" },
  { cat: "Nostalgia", text: "¿Qué traían siempre a las juntadas de más chicos que ya no se usa?" },
];

function topicCategories() {
  return [...new Set(TOPIC_SUGGESTIONS.map(t => t.cat))];
}

function randomTopicSuggestion(cat) {
  const pool = cat && cat !== "todas" ? TOPIC_SUGGESTIONS.filter(t => t.cat === cat) : TOPIC_SUGGESTIONS;
  if (!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}
const TRIVIA_POOL = [
  { q: "¿Cuántos jugadores hay en cancha por equipo en el fútbol (con arquero)?", opts: ["10","11","12","9"], correct: 1 },
  { q: "¿De qué planta viene la yerba mate?", opts: ["Ilex paraguariensis","Camellia sinensis","Coffea arabica","Theobroma cacao"], correct: 0 },
  { q: "¿En qué año se jugó el primer Mundial de fútbol?", opts: ["1930","1924","1950","1938"], correct: 0 },
  { q: "¿Cuál es la capital de Argentina?", opts: ["Córdoba","Rosario","Buenos Aires","Mendoza"], correct: 2 },
  { q: "¿Cuántos jugadores tiene un equipo de truco (versión clásica de a 2)?", opts: ["1","2","3","4"], correct: 1 },
  { q: "¿En qué mes se celebra el Día del Amigo en Argentina?", opts: ["Junio","Julio","Agosto","Septiembre"], correct: 1 },
  { q: "¿Cuántos minutos dura un tiempo reglamentario de fútbol?", opts: ["30","45","40","50"], correct: 1 },
  { q: "¿Cuál es el hueso más largo del cuerpo humano?", opts: ["Fémur","Húmero","Tibia","Radio"], correct: 0 },
  { q: "¿Cuántos continentes se enseñan tradicionalmente en Argentina?", opts: ["5","6","7","4"], correct: 0 },
  { q: "¿Cuántas cuerdas tiene una guitarra criolla estándar?", opts: ["4","5","6","7"], correct: 2 },
];

/* ---------- estado global ---------- */
let DB = null;        // datos compartidos (juntadas, foro, temáticas, trivia, exterior)
let AUTH = null;       // contraseñas compartidas { nombre: pass }
let currentUser = null; // string | null (solo en memoria, no persiste al recargar)
let currentTab = "panel";
let editingCell = null; // { date, member } | null
let loginError = "";
let loading = true;
let loadError = false;
let triviaStarted = {}; // { date: true } en memoria, por sesión
let triviaTimerInterval = null;
let triviaTimeLeft = 10;
let expFormDate = null; // string | null — fecha seleccionada en el form de "cargar gasto"

/* ---------- utilidades ---------- */

function fmtDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return `${d} de ${MONTHS_ES[m - 1]} de ${y}`;
}

function fmtMoney(n) {
  const v = Math.round((n + Number.EPSILON) * 100) / 100;
  return "$" + v.toLocaleString("es-AR", { maximumFractionDigits: 2 });
}

function escapeHtml(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function sortedJuntadas() {
  return [...DB.juntadas].sort((a, b) => (a.date < b.date ? 1 : -1));
}

function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (h * 31 + str.charCodeAt(i)) >>> 0;
  }
  return h;
}

/* ---------- seed data ---------- */

function seedDB() {
  // Un grupo nuevo arranca 100% vacío — sin gente, sin juntadas, sin nada.
  // Quien lo crea se agrega como primer miembro/admin en createGroup().
  return {
    juntadas: [],
    external: { log: [] },
    topics: {},
    forum: {},
    trivia: { responses: {} },
    rsvp: null,
    findes: [],
    containerDebates: [],
    containerActiveByDebate: [],
    members: [],
    admins: [],
    memberPhotos: {},
  };
}

/* ---------- cálculos ---------- */

function attendeesOf(j) {
  return CORE_MEMBERS.filter(m => j.attendance[m] === "presente" || j.attendance[m] === "anfitrion");
}

function expenseParticipants(j) {
  if (j.expense && Array.isArray(j.expense.participants) && j.expense.participants.length) {
    return j.expense.participants;
  }
  return attendeesOf(j);
}

function computeStats(member) {
  const js = DB.juntadas;
  const total = js.length;
  let asistencias = 0, anfitrion = 0, faltas = 0, avisadas = 0;
  js.forEach(j => {
    const st = j.attendance[member];
    if (st === "presente" || st === "anfitrion") asistencias++;
    if (st === "anfitrion") anfitrion++;
    if (st === "avisado" || st === "sin_avisar") {
      faltas++;
      if (st === "avisado") avisadas++;
    }
  });
  const pct = total ? Math.round((asistencias / total) * 100) : 0;
  const confiab = faltas === 0 ? null : Math.round((avisadas / faltas) * 100);
  // racha: consecutivas desde la más reciente
  const desc = sortedJuntadas();
  let racha = 0;
  for (const j of desc) {
    const st = j.attendance[member];
    if (st === "presente" || st === "anfitrion") racha++;
    else break;
  }
  return { asistencias, total, pct, anfitrion, confiab, racha, faltas };
}

function bestStreak(member) {
  const asc = [...DB.juntadas].sort((a, b) => (a.date < b.date ? -1 : 1));
  let best = 0, cur = 0;
  asc.forEach(j => {
    const st = j.attendance[member];
    if (st === "presente" || st === "anfitrion") { cur++; best = Math.max(best, cur); }
    else cur = 0;
  });
  return best;
}

function computeRecord() {
  let best = { count: 0, date: null };
  DB.juntadas.forEach(j => {
    const count = attendeesOf(j).length;
    if (count > best.count) best = { count, date: j.date };
  });
  return best;
}

function computeBlacklist() {
  const desc = sortedJuntadas();
  if (!desc.length) return [];
  const last = desc[0];
  return CORE_MEMBERS.filter(m => {
    const st = last.attendance[m];
    return st === "avisado" || st === "sin_avisar";
  });
}

function computeContainerStreak(member) {
  const desc = sortedJuntadas();
  let streak = 0;
  for (const j of desc) {
    const st = j.attendance[member];
    if (st === "avisado" || st === "sin_avisar") streak++;
    else break;
  }
  return streak;
}

function containerMembersCombined() {
  const auto = CORE_MEMBERS.filter(m => computeContainerStreak(m) >= 2);
  const voted = DB.containerActiveByDebate || [];
  const set = new Set([...auto, ...voted]);
  return [...set].map(m => ({ m, auto: auto.includes(m), voted: voted.includes(m) }));
}

/* ---------- cálculos: fin de semana ---------- */

function sortedFindes() {
  return [...DB.findes].sort((a, b) => (a.date < b.date ? 1 : -1));
}

function computeFindeStats(member) {
  const total = DB.findes.length;
  const asistencias = DB.findes.filter(f => f.attendance[member]).length;
  const pct = total ? Math.round((asistencias / total) * 100) : 0;
  return { asistencias, total, pct };
}

function computeBalances() {
  const balance = {};
  CORE_MEMBERS.forEach(m => (balance[m] = 0));
  DB.juntadas.forEach(j => {
    if (!j.expense) return;
    const participants = expenseParticipants(j);
    if (!participants.length) return;
    const share = j.expense.monto / participants.length;
    participants.forEach(m => (balance[m] -= share));
    if (balance[j.expense.payer] === undefined) balance[j.expense.payer] = 0;
    balance[j.expense.payer] += j.expense.monto;
  });
  return balance;
}

function computeSettlements(balance) {
  const creditors = [];
  const debtors = [];
  Object.entries(balance).forEach(([m, v]) => {
    if (v > 0.5) creditors.push({ m, v });
    else if (v < -0.5) debtors.push({ m, v: -v });
  });
  creditors.sort((a, b) => b.v - a.v);
  debtors.sort((a, b) => b.v - a.v);
  const moves = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const amt = Math.min(debtors[i].v, creditors[j].v);
    moves.push({ from: debtors[i].m, to: creditors[j].m, amt });
    debtors[i].v -= amt;
    creditors[j].v -= amt;
    if (debtors[i].v < 0.5) i++;
    if (creditors[j].v < 0.5) j++;
  }
  return moves;
}

function resizeImageToDataURL(file, maxSize, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer el archivo."));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error("No se pudo leer la imagen."));
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = maxSize;
        canvas.height = maxSize;
        const ctx = canvas.getContext("2d");
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2;
        const sy = (img.height - side) / 2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function loadAll() {
  loading = true;
  loadError = false;
  groupNotFound = false;
  render();

  GROUP_ID = getGroupIdFromUrl();

  if (!initFirebase()) {
    console.error("Firebase no está configurado o no cargó el SDK.");
    loadError = true;
    loading = false;
    render();
    return;
  }

  const signedIn = await firebaseSignIn();
  if (!signedIn) {
    console.error("No se pudo autenticar contra Firebase (revisá que Anonymous esté habilitado).");
    loadError = true;
    loading = false;
    render();
    return;
  }

  if (!GROUP_ID) {
    // sin grupo en la URL: mostramos la pantalla de crear/entrar
    DB = null;
    AUTH = {};
    loading = false;
    render();
    return;
  }

  try {
    const metaSnap = await fbRoot.ref(groupPath("meta")).once("value");
    if (!metaSnap.exists()) {
      groupNotFound = true;
      loading = false;
      render();
      return;
    }
    GROUP_META = metaSnap.val();

    const dbSnap = await fbRoot.ref(groupPath("db")).once("value");
    DB = dbSnap.exists() ? dbSnap.val() : seedDB();
    normalizeDB();
    applyVibe();

    const authSnap = await fbRoot.ref(groupPath("auth")).once("value");
    AUTH = authSnap.exists() ? authSnap.val() : {};

    // sincronización en vivo: si otro guarda algo, se actualiza solo acá
    fbRoot.ref(groupPath("db")).on("value", snap => {
      if (editingCell) return; // no pisar un formulario que estoy llenando
      if (snap.exists()) {
        DB = snap.val();
        normalizeDB();
        applyVibe();
        render();
      }
    });
  } catch (err) {
    console.error("Error cargando datos:", err);
    loadError = true;
  }
  loading = false;
  render();
}

  if (DB.juntadas.some(j => j.date === date)) { alert("Ya existe una juntada confirmada en esa fecha."); return; }
  DB.rsvp = { date, responses: {} };
  await saveDB();
  render();
}

async function respondRsvp(choice) {
  if (!currentUser || !DB.rsvp) return;
  if (!["si", "no", "tal_vez"].includes(choice)) return;
  DB.rsvp.responses[currentUser] = choice;
  await saveDB();
  render();
}

async function cancelRsvp() {
  if (!isAdmin(currentUser)) return;
  if (!confirm("¿Cancelar la votación de la próxima juntada? Se pierden los votos cargados.")) return;
  DB.rsvp = null;
  await saveDB();
  render();
}

async function confirmRsvp(host) {
  if (!isAdmin(currentUser) || !DB.rsvp) return;
  if (!host) { alert("Elegí quién anfitrionea."); return; }
  const date = DB.rsvp.date;
  if (DB.juntadas.some(j => j.date === date)) {
    alert("Ya existe una juntada en esa fecha, se descarta la votación.");
    DB.rsvp = null;
    await saveDB();
    render();
    return;
  }
  const attendance = {};
  const motivo = {};
  const responses = DB.rsvp.responses || {};
  CORE_MEMBERS.forEach(m => {
    if (m === host) { attendance[m] = "anfitrion"; return; }
    const r = responses[m];
    if (r === "no") { attendance[m] = "avisado"; motivo[m] = "Avisó que no venía"; }
    else if (r === "tal_vez") { attendance[m] = "avisado"; motivo[m] = "Había dicho que tal vez venía"; }
    else { attendance[m] = "presente"; }
  });
  DB.juntadas.push({ date, host, attendance, motivo, expense: null });
  DB.rsvp = null;
  await saveDB();
  render();
}

async function saveExpense(date, payer, monto, participants) {

  if (!payer || isNaN(n) || n <= 0) { alert("Completá pagador y un monto válido."); return; }

  j.expense = { payer, monto: n, participants };
  await saveDB();
  render();
}

async function clearExpense(date) {

}

/* ---------- acciones: trivia ---------- */

function triviaQuestionFor(date) {
  const idx = simpleHash(date) % TRIVIA_POOL.length;
  return TRIVIA_POOL[idx];
}

function startTrivia(date) {
  triviaStarted[date] = true;
  triviaTimeLeft = 10;
  render();
  clearInterval(triviaTimerInterval);
  triviaTimerInterval = setInterval(() => {
    triviaTimeLeft--;
    const el = document.getElementById("trivia-timer");
    if (el) el.textContent = triviaTimeLeft + "s";
    if (triviaTimeLeft <= 0) {
      clearInterval(triviaTimerInterval);
      lockTriviaTimeout(date);
    }
  }, 1000);
}

async function lockTriviaTimeout(date) {
  if (!DB.trivia.responses[date]) DB.trivia.responses[date] = {};
  if (!DB.trivia.responses[date][currentUser]) {
    DB.trivia.responses[date][currentUser] = { choice: null, correct: false };
    await saveDB();
  }
  render();
}

async function answerTrivia(date, choiceIdx) {
  clearInterval(triviaTimerInterval);
  const question = triviaQuestionFor(date);
  const correct = choiceIdx === question.correct;
  if (!DB.trivia.responses[date]) DB.trivia.responses[date] = {};
  DB.trivia.responses[date][currentUser] = { choice: choiceIdx, correct };
  await saveDB();
  render();
}

function triviaRanking() {
  const scores = {};
  CORE_MEMBERS.forEach(m => (scores[m] = 0));
  Object.values(DB.trivia.responses).forEach(dayResponses => {
    Object.entries(dayResponses).forEach(([member, r]) => {
      if (scores[member] === undefined) scores[member] = 0;
      if (r.correct) scores[member]++;
    });
  });
  return Object.entries(scores).sort((a, b) => b[1] - a[1]);
}

/* ---------- acciones: debates del container ---------- */

async function openDebate(member, reason) {
  if (!currentUser) return;
  if (!member) { alert("Elegí a quién nominás."); return; }
  if (!reason || !reason.trim()) { alert("Escribí el motivo."); return; }
  const debate = {
    id: "d" + Date.now() + Math.floor(Math.random() * 1000),
    member,
    reason: reason.trim(),
    openedBy: currentUser,
    openedDate: new Date().toISOString().slice(0, 10),
    votes: {},
    status: "abierto",
    result: null,
    closedDate: null,
  };
  DB.containerDebates.push(debate);
  await saveDB();
  render();
}

async function voteDebate(id, choice) {
  if (!currentUser) return;
  if (!["si", "no"].includes(choice)) return;
  const d = DB.containerDebates.find(x => x.id === id);
  if (!d || d.status !== "abierto") return;
  d.votes[currentUser] = choice;
  await saveDB();
  render();
}

async function closeDebate(id) {
  if (!isAdmin(currentUser)) return;
  const d = DB.containerDebates.find(x => x.id === id);
  if (!d || d.status !== "abierto") return;
  const votes = Object.values(d.votes);
  const si = votes.filter(v => v === "si").length;
  const no = votes.filter(v => v === "no").length;
  const result = si > no ? "container" : "absuelto";
  const msg = `Cerrar el debate sobre ${d.member} (Sí: ${si}, No: ${no}) → resultado: ${result === "container" ? "va al container" : "se salva"}. ¿Confirmar?`;
  if (!confirm(msg)) return;
  d.status = "cerrado";
  d.result = result;
  d.closedDate = new Date().toISOString().slice(0, 10);
  if (result === "container") {
    if (!DB.containerActiveByDebate.includes(d.member)) DB.containerActiveByDebate.push(d.member);
  } else {
    DB.containerActiveByDebate = DB.containerActiveByDebate.filter(m => m !== d.member);
  }
  await saveDB();
  render();
}

                <td class="blue">${r.s.confiab === null ? "—" : r.s.confiab + "%"}</td>
                <td>${r.s.racha} 🔥</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const addForm = currentUser ? `
    <div class="card">
      <h3>➕ Agregar juntada</h3>
      <div class="form-row">
        <input id="new-juntada-date" type="date" />
        <select id="new-juntada-host">${CORE_MEMBERS.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("")}</select>
        <button class="btn" onclick="submitAddJuntada()">Crear juntada</button>
      </div>
      <p class="hint">Por defecto todos figuran presentes salvo el anfitrión (👑). Cada uno edita su propia casilla si no fue.</p>
    </div>
  ` : "";

  return `
    ${renderQuickStats(record, rows)}
    <div class="dashboard-grid">
      <div class="dashboard-col">
        <div class="card record-card">
          🏅 Récord del grupo: ${record.date ? `<b>${record.count} presentes</b> el <b>${fmtDate(record.date)}</b>` : "todavía sin datos"}
        </div>
        ${renderRsvpCard()}
        ${blacklist.length ? `
          <div class="card blacklist-card">
            <h3>🚫 Lista negra</h3>
            <p class="names-line">${blacklist.map(escapeHtml).join(", ")}</p>
            <p class="hint">Quiénes no vinieron a la última juntada.</p>
          </div>
        ` : ""}
      </div>
      <div class="dashboard-col dashboard-col-wide">
        ${leaderboard}
      </div>
    </div>
    ${addForm}
    ${renderPlanillaCard()}
    ${renderExteriorCard()}
  `;
}

function renderRsvpCard() {
  if (!DB.rsvp) {
    if (!isAdmin(currentUser)) {
      return `<div class="card"><h3>📅 Próxima juntada</h3><p class="hint">Todavía no se abrió la votación para la próxima juntada.</p></div>`;
    }
    return `
      <div class="card">
        <h3>📅 Próxima juntada</h3>
        <p class="hint">Abrí la votación para que todos digan si van.</p>
        <div class="form-row">
          <input id="rsvp-date" type="date" />
          <button class="btn btn-sm" onclick="submitOpenRsvp()">Abrir votación</button>
        </div>
      </div>
    `;
  }

  const responses = DB.rsvp.responses || {};
  const counts = { si: 0, no: 0, tal_vez: 0 };
  CORE_MEMBERS.forEach(m => { if (responses[m]) counts[responses[m]]++; });
  const sinResponder = CORE_MEMBERS.filter(m => !responses[m]);
  const myChoice = currentUser ? responses[currentUser] : null;

  const voteButtons = currentUser ? `
    <div class="rsvp-vote-row">
      <button class="btn btn-sm ${myChoice === "si" ? "rsvp-active-si" : "btn-ghost"}" onclick="respondRsvp('si')">✓ Sí voy</button>
      <button class="btn btn-sm ${myChoice === "tal_vez" ? "rsvp-active-tal" : "btn-ghost"}" onclick="respondRsvp('tal_vez')">? Tal vez</button>
      <button class="btn btn-sm ${myChoice === "no" ? "rsvp-active-no" : "btn-ghost"}" onclick="respondRsvp('no')">✕ No voy</button>
    </div>
  ` : `<p class="hint">Iniciá sesión para votar.</p>`;

  const suggested = suggestHost();
  const adminBox = isAdmin(currentUser) ? `
    <div class="rsvp-admin-box">
      <div class="form-row">
        <select id="rsvp-host">${CORE_MEMBERS.map(m => `<option value="${escapeHtml(m)}" ${m === suggested ? "selected" : ""}>${escapeHtml(m)}${m === suggested ? " (sugerido)" : ""}</option>`).join("")}</select>
        <button class="btn btn-sm" onclick="submitConfirmRsvp()">Confirmar juntada</button>
        <a class="link" onclick="cancelRsvp()">Cancelar votación</a>
      </div>
      <p class="hint">Al confirmar: los "No" quedan como avisado, los "Tal vez" también avisado con una nota, y quien no respondió queda presente por defecto.</p>
    </div>
  ` : "";

  return `
    <div class="card">
      <h3>📅 Próxima juntada: ${fmtDate(DB.rsvp.date)}</h3>
      <p class="dim">✓ Sí: ${counts.si} &nbsp; ? Tal vez: ${counts.tal_vez} &nbsp; ✕ No: ${counts.no} &nbsp; · Sin responder: ${sinResponder.length}</p>
      ${voteButtons}
      <div class="rsvp-lists">
        ${renderRsvpGroup("✓ Van", CORE_MEMBERS.filter(m => responses[m] === "si"))}
        ${renderRsvpGroup("? Tal vez", CORE_MEMBERS.filter(m => responses[m] === "tal_vez"))}
        ${renderRsvpGroup("✕ No van", CORE_MEMBERS.filter(m => responses[m] === "no"))}
        ${renderRsvpGroup("— Sin responder", sinResponder)}
      </div>
      ${adminBox}
    </div>
  `;
}

function renderRsvpGroup(title, members) {
  if (!members.length) return "";
  return `<div class="rsvp-group"><b>${title}:</b> ${members.map(escapeHtml).join(", ")}</div>`;
}

function submitOpenRsvp() {
  const date = document.getElementById("rsvp-date").value;
  openRsvp(date);
}

function submitConfirmRsvp() {
  const host = document.getElementById("rsvp-host").value;
  confirmRsvp(host);
}

function renderPlanillaCard() {
  const desc = sortedJuntadas();
  if (!desc.length) {
    return `<div class="card"><h3>📋 Planilla semana a semana</h3><p class="hint">Todavía no hay juntadas cargadas.</p></div>`;
  }
  const adminMode = isAdmin(currentUser);
  const header = `<tr><th class="sticky-col">Fecha</th>${CORE_MEMBERS.map(m => `<th>${escapeHtml(m)}</th>`).join("")}${adminMode ? '<th></th>' : ""}</tr>`;
  const body = desc.map(j => {
    const cells = CORE_MEMBERS.map(m => renderCell(j, m)).join("");
    const deleteCell = adminMode ? `<td><a class="link del-link" onclick="deleteJuntada('${j.date}')" title="Borrar esta juntada" aria-label="Borrar la juntada del ${fmtDate(j.date)}">🗑️</a></td>` : "";
    return `<tr><td class="sticky-col">${fmtDate(j.date)}</td>${cells}${deleteCell}</tr>`;
  }).join("");

  return `
    <div class="card">
      <h3>📋 Planilla semana a semana</h3>
      <div class="table-wrap">
        <table class="planilla">
          <thead>${header}</thead>
          <tbody>${body}</tbody>
        </table>
      </div>
      <div class="legend">
        ${Object.values(STATUS_META).map(s => `<span class="legend-item"><span class="badge ${s.cls}">${s.icon}</span> ${s.label}</span>`).join("")}
        <span class="legend-item"><span class="motivo-dot"></span> Tiene motivo cargado</span>
      </div>
    </div>
  `;
}

function renderCell(j, member) {
  const isEditing = editingCell && editingCell.date === j.date && editingCell.member === member;
  if (isEditing) {
    const current = j.attendance[member];
    const motivo = j.motivo[member] || "";
    return `<td class="edit-td">
      <div class="edit-cell">
        <select id="edit-status">
          ${Object.entries(STATUS_META).map(([k, v]) => `<option value="${k}" ${k === current ? "selected" : ""}>${v.icon} ${v.label}</option>`).join("")}
        </select>
        <input id="edit-motivo" placeholder="Motivo (opcional)" value="${escapeHtml(motivo)}" />
        <div class="edit-actions">
          <button class="btn btn-xs" onclick="submitEditCell('${j.date}','${escapeAttr(member)}')">Guardar</button>
          <button class="btn btn-xs btn-ghost" onclick="cancelEditCell()">Cancelar</button>
        </div>
      </div>
    </td>`;
  }
  const status = j.attendance[member];
  const meta = STATUS_META[status] || { icon: "?", cls: "" };
  const hasMotivo = !!j.motivo[member];
  const clickable = currentUser === member || isAdmin(currentUser);
  return `<td class="cell-td ${clickable ? "clickable" : ""}" ${clickable ? `onclick="openEditCell('${j.date}','${escapeAttr(member)}')"` : ""} title="${hasMotivo ? escapeHtml(j.motivo[member]) : ""}">
    <span class="badge ${meta.cls}">${meta.icon}</span>${hasMotivo ? '<span class="motivo-dot"></span>' : ""}
  </td>`;
}

function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }

function renderAvatar(name, size) {
  const s = size || 30;
  const photo = DB && DB.memberPhotos && DB.memberPhotos[name];
  if (photo) {
    return `<img src="${photo}" class="avatar avatar-photo" style="width:${s}px;height:${s}px;" alt="${escapeHtml(name)}"/>`;
  }
  const color = avatarColorFor(name);
  const style = size ? `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.4)}px;` : "";
  return `<span class="avatar" style="background:${color};${style}" aria-hidden="true">${escapeHtml(initialsFor(name))}</span>`;
}

function openEditCell(date, member) {
  if (currentUser !== member && !isAdmin(currentUser)) return;
  editingCell = { date, member };
  render();
}

function cancelEditCell() {
  editingCell = null;
  render();
}

function submitEditCell(date, member) {
  const status = document.getElementById("edit-status").value;
  const motivo = document.getElementById("edit-motivo").value;
  saveAttendance(date, member, status, motivo);
}

function submitAddJuntada() {
  const date = document.getElementById("new-juntada-date").value;
  const host = document.getElementById("new-juntada-host").value;
  addJuntada(date, host);
}

function renderExteriorCard() {
  const log = DB.external.log;
  const counts = {};
  log.forEach(e => (counts[e.name] = (counts[e.name] || 0) + 1));
  const names = Object.keys(counts).sort();
  const recent = [...log].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 8);

  const addForm = currentUser ? `
    <div class="form-row">
      <input id="new-ext-name" placeholder="Nombre del amigo" />
      <input id="new-ext-date" type="date" />
      <button class="btn btn-sm" onclick="submitAddExternal()">Registrar</button>
    </div>
  ` : "";

  return `
    <div class="card">
      <h3>🌎 Amigos del exterior</h3>
      <p class="hint">Viven afuera, así que no entran en la tabla de posiciones ni en las rachas — acá queda registrado cuándo se sumaron.</p>
      <p class="names-line">${names.length ? names.map(n => `${escapeHtml(n)} <span class="dim">${counts[n]}</span>`).join("   ") : "Nadie registrado todavía."}</p>
      ${recent.length ? `<ul class="ext-log">${recent.map(e => `<li><span class="dim">${fmtDate(e.date)}</span> — ${escapeHtml(e.name)}</li>`).join("")}</ul>` : ""}
      ${addForm}
    </div>
  `;
}

function submitAddExternal() {
  const name = document.getElementById("new-ext-name").value.trim();
  const date = document.getElementById("new-ext-date").value;
  if (!name || !date) { alert("Completá nombre y fecha."); return; }
  DB.external.log.push({ name, date });
  saveDB().then(render);
}

/* ---------------- GASTOS ---------------- */

function computeGastosDetail() {
  const aporto = {}, share = {};
  CORE_MEMBERS.forEach(m => { aporto[m] = 0; share[m] = 0; });
  DB.juntadas.forEach(j => {
    if (!j.expense) return;
    const participants = expenseParticipants(j);
    if (!participants.length) return;
    const s = j.expense.monto / participants.length;
    participants.forEach(m => { if (share[m] === undefined) share[m] = 0; share[m] += s; });
    if (aporto[j.expense.payer] === undefined) aporto[j.expense.payer] = 0;
    aporto[j.expense.payer] += j.expense.monto;
  });
  return { aporto, share };
}

function renderGastos() {
  const desc = sortedJuntadas();
  const { aporto, share } = computeGastosDetail();
  const balance = computeBalances();
  const settlements = computeSettlements(balance);

  let form = "";
  if (currentUser && desc.length) {
    if (!expFormDate || !desc.some(j => j.date === expFormDate)) expFormDate = desc[0].date;
    const activeJuntada = desc.find(j => j.date === expFormDate);
    const defaultChecked = attendeesOf(activeJuntada);
    form = `
      <div class="card">
        <h3>💸 Cargar gasto de una juntada</h3>
        <div class="form-row">
          <select id="exp-date" onchange="onExpDateChange(this.value)">${desc.map(j => `<option value="${j.date}" ${j.date === expFormDate ? "selected" : ""}>${fmtDate(j.date)}${j.expense ? " (ya tiene gasto)" : ""}</option>`).join("")}</select>
          <select id="exp-payer">${CORE_MEMBERS.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("")}</select>
          <input id="exp-monto" type="number" min="0" step="1" placeholder="Monto total $" />
        </div>
        <p class="hint" style="margin-top:12px;">¿Quiénes participan de este gasto en particular? Por defecto tildé a los que estuvieron presentes, pero lo podés ajustar — no todos tienen por qué entrar.</p>
        <div class="participants-actions">
          <a class="link" onclick="setAllParticipants(true)">Marcar todos</a>
          <a class="link" onclick="setAllParticipants(false)">Ninguno</a>
          <a class="link" onclick="setDefaultParticipants()">Solo los presentes ese día</a>
        </div>
        <div class="participants-grid">
          ${CORE_MEMBERS.map(m => `
            <label class="participant-chip">
              <input type="checkbox" class="exp-participant" value="${escapeHtml(m)}" ${defaultChecked.includes(m) ? "checked" : ""}/>
              ${escapeHtml(m)}
            </label>
          `).join("")}
        </div>
        <button class="btn btn-sm" style="margin-top:12px;" onclick="submitExpense()">Guardar gasto</button>
      </div>
    `;
  }

  const table = `
    <div class="card">
      <h3>🧾 Gastos por juntada</h3>
      <div class="table-wrap">
        <table class="board">
          <thead><tr><th>Fecha</th><th>Pagó</th><th>Monto</th><th>Entre</th><th>C/u</th><th></th></tr></thead>
          <tbody>
            ${desc.filter(j => j.expense).map(j => {
              const participants = expenseParticipants(j);
              const cu = participants.length ? j.expense.monto / participants.length : 0;
              return `<tr>
                <td>${fmtDate(j.date)}</td>
                <td class="name">${escapeHtml(j.expense.payer)}</td>
                <td>${fmtMoney(j.expense.monto)}</td>
                <td title="${participants.map(escapeHtml).join(", ")}">${participants.length}</td>
                <td>${fmtMoney(cu)}</td>
                <td>${currentUser ? `<a class="link" onclick="clearExpense('${j.date}')">borrar</a>` : ""}</td>
              </tr>`;
            }).join("") || `<tr><td colspan="6" class="hint">Todavía no se cargó ningún gasto.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const balanceTable = `
    <div class="card">
      <h3>⚖️ Balance por persona</h3>
      <div class="table-wrap">
        <table class="board">
          <thead><tr><th>Nombre</th><th>Aportó</th><th>Le tocaba</th><th>Balance</th></tr></thead>
          <tbody>
            ${CORE_MEMBERS.map(m => {
              const b = balance[m] || 0;
              const cls = b > 0.5 ? "green" : b < -0.5 ? "red" : "dim";
              return `<tr>
                <td class="name">${escapeHtml(m)}</td>
                <td>${fmtMoney(aporto[m] || 0)}</td>
                <td>${fmtMoney(share[m] || 0)}</td>
                <td class="${cls}">${b >= 0 ? "+" : ""}${fmtMoney(b)}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const settlementsCard = `
    <div class="card">
      <h3>🤝 Para saldar cuentas</h3>
      ${settlements.length
        ? `<ul class="settlements">${settlements.map(s => `<li><b>${escapeHtml(s.from)}</b> le debe <b class="accent">${fmtMoney(s.amt)}</b> a <b>${escapeHtml(s.to)}</b></li>`).join("")}</ul>`
        : `<p class="hint">Todo saldado. 🎉</p>`}
    </div>
  `;

  return form + table + balanceTable + settlementsCard + renderSettlementsByPersonCard(settlements);
}

function onExpDateChange(date) {
  expFormDate = date;
  render();
}

function setAllParticipants(checked) {
  document.querySelectorAll(".exp-participant").forEach(el => (el.checked = checked));
}

function setDefaultParticipants() {
  const desc = sortedJuntadas();
  const j = desc.find(x => x.date === expFormDate);
  if (!j) return;
  const defaults = attendeesOf(j);
  document.querySelectorAll(".exp-participant").forEach(el => {
    el.checked = defaults.includes(el.value);
  });
}

function groupSettlementsByPerson(settlements) {
  const map = {};
  CORE_MEMBERS.forEach(m => { map[m] = { owes: [], owedBy: [] }; });
  settlements.forEach(s => {
    if (!map[s.from]) map[s.from] = { owes: [], owedBy: [] };
    if (!map[s.to]) map[s.to] = { owes: [], owedBy: [] };
    map[s.from].owes.push({ to: s.to, amt: s.amt });
    map[s.to].owedBy.push({ from: s.from, amt: s.amt });
  });
  return map;
}

function renderSettlementsByPersonCard(settlements) {
  const map = groupSettlementsByPerson(settlements);
  const withActivity = CORE_MEMBERS.filter(m => map[m].owes.length || map[m].owedBy.length);
  if (!withActivity.length) {
    return `<div class="card"><h3>📋 Detalle por persona</h3><p class="hint">Todo saldado, nadie le debe nada a nadie. 🎉</p></div>`;
  }
  return `
    <div class="card">
      <h3>📋 Detalle por persona</h3>
      <p class="hint">Tocá a cada uno y ves puntualmente qué le debe a quién.</p>
      <div class="person-debts">
        ${withActivity.map(m => `
          <div class="person-debt-block">
            <div class="person-debt-name">${escapeHtml(m)}</div>
            ${map[m].owes.map(o => `<div class="debt-line red">↳ le debe <b>${fmtMoney(o.amt)}</b> a <b>${escapeHtml(o.to)}</b></div>`).join("")}
            ${map[m].owedBy.map(o => `<div class="debt-line green">↳ <b>${escapeHtml(o.from)}</b> le debe <b>${fmtMoney(o.amt)}</b></div>`).join("")}
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function submitExpense() {
  const date = document.getElementById("exp-date").value;
  const payer = document.getElementById("exp-payer").value;
  const monto = document.getElementById("exp-monto").value;
  const participants = Array.from(document.querySelectorAll(".exp-participant:checked")).map(el => el.value);
  saveExpense(date, payer, monto, participants);
}

/* ---------------- CONTAINER ---------------- */

function renderContainer() {
  const combined = containerMembersCombined();
  const streaks = CORE_MEMBERS.map(m => ({ m, streak: computeContainerStreak(m) }));
  const oneAway = streaks.filter(s => s.streak === 1 && !combined.some(c => c.m === s.m));

  const explanation = `
    <div class="card">
      <h3>📦 Cómo funciona el Container</h3>
      <p class="hint">Dos caminos: automático (2 juntadas seguidas ausente) o por debate — cualquiera puede abrir una moción explicando el motivo, el grupo vota Sí/No, y el admin cierra el debate aplicando el resultado. También sirve para "indultar" a alguien: si el debate sale "No", y estaba en el container por un debate anterior, sale.</p>
    </div>
  `;

  const inContainerCard = `
    <div class="card container-card">
      <h3>😬 En el container</h3>
      ${combined.length
        ? `<ul class="container-list">${combined.map(c => `
            <li><b>${escapeHtml(c.m)}</b>
              ${c.auto ? '<span class="tag-auto">🤖 2 seguidas</span>' : ""}
              ${c.voted ? '<span class="tag-voted">🗳️ debate</span>' : ""}
            </li>`).join("")}</ul>`
        : `<p class="hint">Nadie está en el container. Así se hace. 💪</p>`}
    </div>
  `;

  const oneAwayCard = oneAway.length ? `
    <div class="card">
      <h3>🔸 A un paso del container</h3>
      <ul class="container-list">${oneAway.map(s => `<li><b>${escapeHtml(s.m)}</b> <span class="dim">— si falta la próxima, cae</span></li>`).join("")}</ul>
    </div>
  ` : "";

  const openDebateForm = currentUser ? `
    <div class="card">
      <h3>⚖️ Abrir un debate</h3>
      <div class="form-row">
        <select id="debate-member">${CORE_MEMBERS.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("")}</select>
        <input id="debate-reason" placeholder="¿Por qué debería ir (o salir) del container?" />
        <button class="btn btn-sm" onclick="submitOpenDebate()">Abrir debate</button>
      </div>
    </div>
  ` : `<div class="card"><p class="hint">Iniciá sesión para abrir un debate o votar.</p></div>`;

  const openDebates = DB.containerDebates.filter(d => d.status === "abierto");
  const closedDebates = DB.containerDebates
    .filter(d => d.status === "cerrado")
    .sort((a, b) => (a.closedDate < b.closedDate ? 1 : -1))
    .slice(0, 5);

  const openDebatesCard = `
    <div class="card">
      <h3>🗣️ Debates abiertos</h3>
      ${openDebates.length ? openDebates.map(renderDebateBlock).join("") : `<p class="hint">No hay debates abiertos ahora mismo.</p>`}
    </div>
  `;

  const closedDebatesCard = closedDebates.length ? `
    <div class="card">
      <h3>📜 Últimos debates resueltos</h3>
      <ul class="container-list">
        ${closedDebates.map(d => {
          const si = Object.values(d.votes).filter(v => v === "si").length;
          const no = Object.values(d.votes).filter(v => v === "no").length;
          return `<li><b>${escapeHtml(d.member)}</b> — ${d.result === "container" ? "📦 fue al container" : "✅ se salvó"} <span class="dim">(${fmtDate(d.closedDate)}, Sí ${si} · No ${no})</span><br/><span class="dim">"${escapeHtml(d.reason)}"</span></li>`;
        }).join("")}
      </ul>
    </div>
  ` : "";

  return explanation + inContainerCard + oneAwayCard + openDebateForm + openDebatesCard + closedDebatesCard;
}

function renderDebateBlock(d) {
  const si = Object.values(d.votes).filter(v => v === "si").length;
  const no = Object.values(d.votes).filter(v => v === "no").length;
  const myVote = currentUser ? d.votes[currentUser] : null;
  return `
    <div class="debate-block">
      <div class="debate-head"><b>${escapeHtml(d.member)}</b> <span class="dim">— propuesto por ${escapeHtml(d.openedBy)} el ${fmtDate(d.openedDate)}</span></div>
      <p class="debate-reason">"${escapeHtml(d.reason)}"</p>
      <p class="dim">Sí: ${si} &nbsp; No: ${no}</p>
      ${currentUser ? `
        <div class="rsvp-vote-row">
          <button class="btn btn-sm ${myVote === "si" ? "btn-debate-si" : "btn-ghost"}" onclick="voteDebate('${d.id}','si')">Sí, que vaya</button>
          <button class="btn btn-sm ${myVote === "no" ? "btn-debate-no" : "btn-ghost"}" onclick="voteDebate('${d.id}','no')">No, que se salve</button>
        </div>
      ` : ""}
      ${isAdmin(currentUser) ? `<a class="link" onclick="closeDebate('${d.id}')">Cerrar debate</a>` : ""}
    </div>
  `;
}

function submitOpenDebate() {
  const member = document.getElementById("debate-member").value;
  const reason = document.getElementById("debate-reason").value;
  openDebate(member, reason);
}

/* ---------------- TEMATICAS ---------------- */

function renderTematicas() {
  let proposeBox = "";

    const cats = topicCategories();
    proposeBox = `
      <div class="card">
        <h3>💡 Proponé tu temática</h3>
        <p class="hint">Solo tenés una propuesta por siempre — elegila bien. Si no se te ocurre nada, pedí una sugerencia.</p>
        <div class="form-row">
          <select id="topic-cat">
            <option value="todas">Cualquier categoría</option>
            ${cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("")}
          </select>
          <button class="btn btn-sm btn-ghost" onclick="fillRandomTopic()">🎲 Sugerime un tema</button>
        </div>
        <div class="form-row" style="margin-top:10px;">
          <input id="topic-input" placeholder="Ej: ¿Se puede vivir sin streaming?" />
          <button class="btn btn-sm" onclick="submitTopic()">Proponer</button>
        </div>
        <p class="hint" style="margin-top:8px;">Las sugerencias son un pool fijo que armo yo — si quieren temas nuevos o más picantes, me piden y se los actualizo.</p>
      </div>
    `;
  } else if (currentUser && DB.topics[currentUser]) {
    proposeBox = `<div class="card"><p class="hint">Ya usaste tu propuesta: <b>${escapeHtml(DB.topics[currentUser])}</b></p></div>`;
  }

    <div class="card">
      <h3>🗒️ Temáticas propuestas</h3>
      <ul class="topics-list">

          <li><b>${escapeHtml(m)}</b>: ${DB.topics[m] ? escapeHtml(DB.topics[m]) : '<span class="dim">— todavía no propuso —</span>'}</li>

function fillRandomTopic() {
  const cat = document.getElementById("topic-cat").value;
  const suggestion = randomTopicSuggestion(cat);
  if (suggestion) document.getElementById("topic-input").value = suggestion.text;
}

function submitTopic() {
  const topic = document.getElementById("topic-input").value;
  proposeTopic(currentUser, topic);
}

/* ---------------- FORO ---------------- */

function renderForo() {
  const desc = sortedJuntadas();
  if (!desc.length) return `<div class="card"><p class="hint">Todavía no hay juntadas.</p></div>`;
  return `
    <div class="card"><h3>💬 Foro semanal</h3><p class="hint">Un hilo de comentarios por cada juntada.</p></div>
    ${desc.map(j => {
      const comments = DB.forum[j.date] || [];
      const attendees = attendeesOf(j).length;
      return `
        <div class="card">
          <div class="foro-head">
            <b>${fmtDate(j.date)}</b>
            <span class="dim">${attendees} presentes · anfitrión: ${escapeHtml(j.host)}</span>
          </div>
          ${comments.length
            ? `<ul class="comments">${comments.map(c => `
                <li class="comment-row">
                  ${renderAvatar(c.author, 28)}
                  <div class="comment-bubble"><div class="comment-author">${escapeHtml(c.author)}</div>${escapeHtml(c.text)}</div>
                </li>
              `).join("")}</ul>`
            : `<p class="hint italic">Todavía nadie comentó esta juntada.</p>`}
          ${currentUser ? `
            <div class="form-row">
              <input id="comment-${j.date}" placeholder="Escribí algo sobre esta juntada..." onkeydown="if(event.key==='Enter')submitComment('${j.date}')" />
              <button class="btn btn-sm" onclick="submitComment('${j.date}')">➤</button>
            </div>
          ` : ""}
        </div>
      `;
    }).join("")}
  `;
}

function submitComment(date) {
  const input = document.getElementById("comment-" + date);
  const text = input.value;
  input.value = "";
  addComment(date, currentUser, text);
}

/* ---------------- TRIVIA ---------------- */

function renderTrivia() {
  const desc = sortedJuntadas();
  if (!desc.length) return `<div class="card"><p class="hint">Todavía no hay juntadas.</p></div>`;
  const date = desc[0].date;
  const question = triviaQuestionFor(date);
  const myResponse = DB.trivia.responses[date] && DB.trivia.responses[date][currentUser];

  let body;
  if (!currentUser) {
    body = `<p class="hint">Iniciá sesión para jugar la trivia de esta semana.</p>`;
  } else if (myResponse) {
    const correctOpt = question.opts[question.correct];
    body = `
      <p class="${myResponse.correct ? "green" : "red"}">
        ${myResponse.correct ? "✓ ¡Acertaste!" : myResponse.choice === null ? "⏱️ Se acabó el tiempo." : "✕ No era esa."}
      </p>
      <p class="hint">La pregunta era: <b>${escapeHtml(question.q)}</b><br/>Respuesta correcta: <b>${escapeHtml(correctOpt)}</b></p>
    `;
  } else if (triviaStarted[date]) {
    body = `
      <p class="trivia-q">${escapeHtml(question.q)} <span id="trivia-timer" class="trivia-timer">${triviaTimeLeft}s</span></p>
      <div class="trivia-opts">
        ${question.opts.map((o, i) => `<button class="btn btn-opt" onclick="answerTrivia('${date}', ${i})">${escapeHtml(o)}</button>`).join("")}
      </div>
    `;
  } else {
    body = `
      <p class="hint">Una pregunta nueva por juntada, la misma para todos. Al arrancar tenés 10 segundos para elegir.</p>
      <button class="btn" onclick="startTrivia('${date}')">Comenzar</button>
    `;
  }

  const ranking = triviaRanking();
  const maxScore = Math.max(1, ...ranking.map(([, s]) => s));

  return `
    <div class="card">
      <h3>🎲 Trivia de la semana</h3>
      <p class="dim">Juntada del ${fmtDate(date)}</p>
      ${body}
    </div>
    <div class="card">
      <h3>🏆 Ranking de trivia</h3>
      ${ranking.map(([m, s]) => `
        <div class="trivia-bar-row">
          <span class="trivia-bar-name">${escapeHtml(m)}</span>
          <span class="trivia-bar-track"><span class="trivia-bar-fill" style="width:${Math.round((s / maxScore) * 100)}%"></span></span>
          <span class="trivia-bar-score">${s}</span>
        </div>
      `).join("")}
    </div>
  `;
}

        <table class="board">

      </div>` : `<p class="hint">Todavía no hay findes cargados.</p>`}
    </div>
  `;

  const addForm = isAdmin(currentUser) ? `
    <div class="card">
      <h3>➕ Agregar finde</h3>
      <div class="form-row">
        <input id="new-finde-date" type="date" />
        <button class="btn btn-sm" onclick="submitAddFinde()">Crear</button>
      </div>
      <p class="hint">Por defecto todos figuran que vinieron — cada uno se puede sacar si no fue, y el admin puede tocar a cualquiera.</p>
    </div>
  ` : "";

  const list = desc.map(f => {
    const vinieron = CORE_MEMBERS.filter(m => f.attendance[m]);

    return `
      <div class="card">

          <b>${fmtDate(f.date)}</b>
          ${isAdmin(currentUser) ? `<a class="link del-link" onclick="deleteFinde('${f.date}')" title="Borrar" aria-label="Borrar el finde del ${fmtDate(f.date)}">🗑️</a>` : ""}
        </div>
        ${isAdmin(currentUser) ? `
          <textarea id="notas-${f.date}" class="notas-box" placeholder="¿Qué pasó este finde? (opcional)">${escapeHtml(f.notas || "")}</textarea>
          <button class="btn btn-xs" onclick="submitFindeNotas('${f.date}')">Guardar plan del día</button>
        ` : (f.notas ? `<p class="finde-notas">${escapeHtml(f.notas)}</p>` : "")}
        <div class="finde-chips">

  return `<span class="chip ${isIn ? "chip-green" : "chip-red"} ${clickable ? "chip-clickable" : ""}" ${clickable ? `onclick="toggleFindeAttendance('${date}','${escapeAttr(member)}')"` : ""}>${escapeHtml(member)}</span>`;

/* ---------------- ESTADÍSTICAS ---------------- */

function renderPodiumGeneric(title, statsFn) {
  const rows = CORE_MEMBERS.map(m => ({ m, pct: statsFn(m).pct })).sort((a, b) => b.pct - a.pct);
  const tiers = [];
  rows.forEach(r => {
    let tier = tiers.find(t => t.pct === r.pct);
    if (!tier) { tier = { pct: r.pct, members: [] }; tiers.push(tier); }
    tier.members.push(r.m);
  });
  const top3 = tiers.slice(0, 3); // top3[0] = 1er puesto, [1] = 2do, [2] = 3ro
  if (!top3.length) return "";
  const displayOrder = [1, 0, 2]; // se muestran visualmente como 2do, 1ro, 3ro
  const medals = { 0: "🥇", 1: "🥈", 2: "🥉" };
  const heights = { 0: "150px", 1: "105px", 2: "80px" };
  const slots = displayOrder.map(idx => {
    const tier = top3[idx];
    if (!tier) return `<div class="podium-slot"></div>`;
    return `
      <div class="podium-slot">
        <div class="podium-medal">${medals[idx]}</div>
        <div class="podium-names">${tier.members.map(escapeHtml).join("<br/>")}</div>
        <div class="podium-bar tier-${idx + 1}" style="min-height:${heights[idx]}">
          <span class="podium-pct">${tier.pct}%</span>
        </div>
      </div>
    `;
  }).join("");
  return `
    <div class="card">
      <h3>${title}</h3>
      <div class="podium">${slots}</div>
    </div>
  `;
}

function renderEstadisticas() {
  const rows = CORE_MEMBERS.map(m => ({ m, cur: computeStats(m).racha, best: bestStreak(m) }))
    .sort((a, b) => b.cur - a.cur || b.best - a.best);

  const podioJueves = renderPodiumGeneric("🏆 Podio de asistencia — Jueves", m => computeStats(m));
  const podioFindes = DB.findes.length ? renderPodiumGeneric("🏆 Podio de asistencia — Findes", m => computeFindeStats(m)) : "";

  const streakTable = `
    <div class="card">
      <h3>🔥 Racha actual vs. mejor racha histórica</h3>
      <div class="table-wrap">
        <table class="board">
          <thead><tr><th>Nombre</th><th>Racha actual</th><th>Mejor racha histórica</th></tr></thead>
          <tbody>${rows.map(r => `<tr><td class="name">${escapeHtml(r.m)}</td><td class="accent">${r.cur} 🔥</td><td class="dim">${r.best} 🔥</td></tr>`).join("")}</tbody>
        </table>
      </div>
    </div>
  `;

  const evoCard = `
    <div class="card">
      <h3>📈 Evolución de asistencia por juntada</h3>
      ${renderEvolutionChart()}
    </div>
  `;

  const compareCard = DB.findes.length ? renderJuevesVsFinde() : "";

  return podioJueves + podioFindes + streakTable + evoCard + compareCard;
}

function renderEvolutionChart() {
  const asc = [...DB.juntadas].sort((a, b) => (a.date < b.date ? -1 : 1));
  if (asc.length < 2) return `<p class="hint">Hace falta más historial para graficar la evolución.</p>`;
  const W = 640, H = 200, padL = 34, padR = 10, padT = 10, padB = 10;
  const n = asc.length;
  const pts = asc.map((j, i) => {
    const pct = Math.round((attendeesOf(j).length / CORE_MEMBERS.length) * 100);
    const x = padL + (i * (W - padL - padR)) / (n - 1);
    const y = padT + ((100 - pct) / 100) * (H - padT - padB);
    return { x, y, pct, date: j.date };
  });
  const pathD = pts.map((p, i) => (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
  const gridColor = cssVar("--panel-border") || "#262932";
  const dimColor = cssVar("--text-dim") || "#8b909b";
  const accentColor = cssVar("--accent") || "#ef5b23";
  const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${accentColor}"><title>${fmtDate(p.date)}: ${p.pct}%</title></circle>`).join("");
  const grid = [0, 50, 100].map(v => {
    const y = padT + ((100 - v) / 100) * (H - padT - padB);
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${gridColor}" stroke-width="1"/><text x="2" y="${y + 4}" font-size="10" fill="${dimColor}">${v}%</text>`;
  }).join("");
  return `
    <svg viewBox="0 0 ${W} ${H}" class="evo-chart" preserveAspectRatio="none">
      ${grid}
      <path d="${pathD}" fill="none" stroke="${accentColor}" stroke-width="2"/>
      ${dots}
    </svg>
    <p class="hint">Pasá el mouse sobre los puntos para ver la fecha y el % de esa juntada. Primera: ${fmtDate(pts[0].date)} · Última: ${fmtDate(pts[pts.length - 1].date)}</p>
  `;
}

function renderJuevesVsFinde() {
  const rows = CORE_MEMBERS.map(m => ({ m, j: computeStats(m).pct, f: computeFindeStats(m).pct }));
  return `
    <div class="card">
      <h3>⚖️ Jueves vs. Finde</h3>
      <div class="table-wrap">
        <table class="board">
          <thead><tr><th>Nombre</th><th>Jueves</th><th>Finde</th></tr></thead>
          <tbody>${rows.map(r => `<tr><td class="name">${escapeHtml(r.m)}</td><td class="accent">${r.j}%</td><td class="blue">${r.f}%</td></tr>`).join("")}</tbody>
        </table>
      </div>
    </div>
  `;
}
